            // =========================================================
            // 13. RENDER: CITY MAP 5x5 SCREEN
            // =========================================================
            function renderCityScreen() {
                const { boardSize, roadW, lotSize, startX, startY } = getCityGeometry();

                // Lush Green Grass Meadow
                ctx.fillStyle = '#2E9E44';
                ctx.fillRect(0, 0, W, H);

                // Subtle pixel grass tufts
                ctx.fillStyle = '#248236';
                for (let gx = 16; gx < W; gx += 44) {
                    for (let gy = 76; gy < H - 70; gy += 44) {
                        ctx.fillRect(gx, gy, 4, 4);
                        ctx.fillRect(gx + 6, gy + 2, 4, 4);
                    }
                }

                // Outer City Board Frame & Asphalt Road Network
                drawArcadeBox(
                    startX - 4,
                    startY - 4,
                    boardSize + 8,
                    boardSize + 8,
                    '#475569',
                    '#334155',
                    '#111827',
                    '#94A3B8'
                );

                // Road Center Markings & Intersection Crosswalks
                ctx.strokeStyle = '#F8FAFC';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                for (let i = 0; i <= GRID_SIZE; i++) {
                    const rx = startX + roadW / 2 + i * (lotSize + roadW);
                    ctx.beginPath();
                    ctx.moveTo(rx, startY + 4);
                    ctx.lineTo(rx, startY + boardSize - 4);
                    ctx.stroke();

                    const ry = startY + roadW / 2 + i * (lotSize + roadW);
                    ctx.beginPath();
                    ctx.moveTo(startX + 4, ry);
                    ctx.lineTo(startX + boardSize - 4, ry);
                    ctx.stroke();
                }
                ctx.setLineDash([]);

                // Crisp white zebra crosswalk stripes near intersections
                ctx.fillStyle = 'rgba(248, 250, 252, 0.72)';
                for (let r = 1; r < GRID_SIZE; r++) {
                    for (let c = 1; c < GRID_SIZE; c++) {
                        const ix = startX + c * (lotSize + roadW);
                        const iy = startY + r * (lotSize + roadW);
                        ctx.fillRect(ix - 5, iy + 2, 3, roadW - 4);
                        ctx.fillRect(ix + roadW + 2, iy + 2, 3, roadW - 4);
                    }
                }

                // Moving Cars along Avenues
                for (const car of state.cars) {
                    ctx.fillStyle = car.color;
                    ctx.strokeStyle = '#111827';
                    ctx.lineWidth = 1.8;
                    if (car.axis === 'h') {
                        const cy = startY + roadW / 2 + car.road * (lotSize + roadW);
                        const cx = startX + car.t * boardSize;
                        if (cx > startX + 4 && cx < startX + boardSize - 4) {
                            ctx.fillRect(cx - 7, cy - 4, 14, 8);
                            ctx.strokeRect(cx - 7, cy - 4, 14, 8);
                        }
                    } else {
                        const cx = startX + roadW / 2 + car.road * (lotSize + roadW);
                        const cy = startY + car.t * boardSize;
                        if (cy > startY + 4 && cy < startY + boardSize - 4) {
                            ctx.fillRect(cx - 4, cy - 7, 8, 14);
                            ctx.strokeRect(cx - 4, cy - 7, 8, 14);
                        }
                    }
                }

                // Tiny Walking Citizens on Sidewalks
                for (const ped of state.pedestrians) {
                    ctx.fillStyle = ped.shirt;
                    if (ped.axis === 'h') {
                        const py = startY + roadW / 2 + ped.road * (lotSize + roadW) + ped.side * (roadW * 0.35);
                        const px = startX + ped.t * boardSize;
                        if (px > startX && px < startX + boardSize) ctx.fillRect(px - 2, py - 2, 4, 4);
                    } else {
                        const px = startX + roadW / 2 + ped.road * (lotSize + roadW) + ped.side * (roadW * 0.35);
                        const py = startY + ped.t * boardSize;
                        if (py > startY && py < startY + boardSize) ctx.fillRect(px - 2, py - 2, 4, 4);
                    }
                }

                // 5x5 Lots & 2.5D Buildings
                const blink = 0.5 + 0.5 * Math.sin(state.animClock * 7);

                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        const rect = getLotRect(r, c);
                        const cell = state.cityGrid[r][c];

                        // Grass Lot Base
                        ctx.fillStyle = cell ? '#4ADE80' : '#86EFAC';
                        ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
                        ctx.strokeStyle = '#111827';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);

                        if (!cell) {
                            // Inner dirt construction plot + tiny decorative park bushes on corners
                            const pad = Math.round(rect.w * 0.16);
                            ctx.fillStyle = '#BEF264';
                            ctx.fillRect(rect.x + pad, rect.y + pad, rect.w - pad * 2, rect.h - pad * 2);

                            // Pixel corner bushes
                            ctx.fillStyle = '#15803D';
                            ctx.fillRect(rect.x + 3, rect.y + 3, 5, 5);
                            ctx.fillRect(rect.x + rect.w - 8, rect.y + 3, 5, 5);

                            if (state.citySubMode === 'PLACING' && state.pendingHouse) {
                                const check = evaluatePlacement(r, c, state.pendingHouse.type, state.pendingHouse);
                                if (check.valid) {
                                    ctx.fillStyle = `rgba(250, 204, 21, ${0.35 + blink * 0.35})`;
                                    ctx.fillRect(rect.x + 2, rect.y + 2, rect.w - 4, rect.h - 4);
                                    ctx.strokeStyle = '#FFD700';
                                    ctx.lineWidth = 3;
                                    ctx.strokeRect(rect.x + 2, rect.y + 2, rect.w - 4, rect.h - 4);

                                    // Show exact population yield on this lot
                                    ctx.fillStyle = '#111827';
                                    ctx.font = `900 ${Math.max(10, Math.round(rect.w * 0.21))}px 'Arial Black', sans-serif`;
                                    ctx.textAlign = 'center';
                                    ctx.textBaseline = 'middle';
                                    ctx.fillText(`+${check.pop}`, rect.x + rect.w / 2, rect.y + rect.h / 2);
                                } else {
                                    ctx.fillStyle = 'rgba(15, 23, 42, 0.42)';
                                    ctx.fillRect(rect.x + 2, rect.y + 2, rect.w - 4, rect.h - 4);
                                }
                            } else {
                                // '+' marker on empty plot
                                ctx.fillStyle = '#15803D';
                                ctx.font = `900 ${Math.round(rect.w * 0.34)}px 'Arial Black', sans-serif`;
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillText('+', rect.x + rect.w / 2, rect.y + rect.h / 2 + 1);
                            }

                            if (state.citySubMode === 'VIEW' || state.citySubMode === 'PLACING') {
                                registerHitbox(`lot_${r}_${c}`, rect.x, rect.y, rect.w, rect.h, () => {
                                    if (state.citySubMode === 'PLACING') {
                                        placePendingHouse(r, c);
                                    } else {
                                        sfx.click();
                                        state.selectedLot = { r, c };
                                        state.citySubMode = 'SELECT_BUILDING';
                                    }
                                });
                            }
                        } else {
                            drawCityLotBuilding(rect, cell, state.citySubMode === 'DEMOLISH');

                            registerHitbox(`occ_${r}_${c}`, rect.x, rect.y, rect.w, rect.h, () => {
                                if (state.citySubMode === 'DEMOLISH') {
                                    sfx.miss();
                                    const pt = getLotCenter(r, c);
                                    addParticles(pt.x, pt.y, '#94A3B8', 18, 1.0);
                                    state.cityGrid[r][c] = null;
                                    state.citySubMode = 'VIEW';
                                    saveGrid();
                                    showBanner('ЗДАНИЕ СНЕСЕНО', 1.6);
                                } else if (state.citySubMode === 'VIEW') {
                                    sfx.click();
                                    const t = BUILDING_TYPES[cell.type];
                                    const gTag = cell.isGoldenRoof ? ' [ЗОЛ.КРЫША]' : '';
                                    showBanner(`${t.name}${gTag}: +${cell.finalPop} ЖИТ.`, 2.0);
                                }
                            });
                        }
                    }
                }

                // =======================================
                // TOP J2ME CITY HUD BAR
                // =======================================
                const stats = getCityStats();
                const targetPop = getNextTargetPop(stats.totalPop);
                const topH = 54;

                drawArcadeBox(6, 6, W - 12, topH, '#1E3A8A', '#0F172A', '#111827', '#38BDF8');

                // Population Counter
                drawPixelPersonIcon(26, 32, 1.05);
                ctx.fillStyle = '#FACC15';
                ctx.font = `900 15px 'Arial Black', sans-serif`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(`${stats.totalPop}`, 42, 24);

                ctx.fillStyle = '#93C5FD';
                ctx.font = `800 10px 'Trebuchet MS', sans-serif`;
                ctx.fillText(`ЦЕЛЬ: ${targetPop}`, 42, 42);

                // Progress bar in center
                const barX = Math.min(145, W * 0.36);
                const barW = Math.max(60, W - barX - 116);
                ctx.fillStyle = '#020617';
                ctx.fillRect(barX, 22, barW, 20);
                ctx.strokeStyle = '#94A3B8';
                ctx.lineWidth = 1.5;

                const pct = Math.min(1, stats.totalPop / targetPop);
                ctx.fillStyle = '#22C55E';
                ctx.fillRect(barX + 2, 24, Math.max(0, (barW - 4) * pct), 16);

                ctx.fillStyle = '#FFFFFF';
                ctx.font = `900 10px 'Arial Black', sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(`${Math.round(pct * 100)}%`, barX + barW / 2, 32);

                // Sound & Menu Buttons
                drawArcadeButton('city_mute', W - 104, 13, 38, 40, '', 'dark', () => {
                    sfx.toggleMute();
                });
                drawSoundIcon(W - 85, 33, sfx.muted);

                drawArcadeButton('city_menu', W - 62, 13, 50, 40, 'МЕНЮ', 'gold', () => {
                    state.mode = 'TITLE';
                    state.citySubMode = 'VIEW';
                }, 11);

                // =======================================
                // BOTTOM CITY ACTION BAR
                // =======================================
                const botY = H - 56;
                if (state.citySubMode === 'PLACING' && state.pendingHouse) {
                    const t = BUILDING_TYPES[state.pendingHouse.type];
                    drawArcadeBox(8, botY, W - 16, 48, '#065F46', '#064E3B', '#111827', '#4ADE80');
                    drawMiniHouseIcon(32, botY + 24, t, state.pendingHouse.isGoldenRoof, 0.85);

                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = `900 12px 'Arial Black', sans-serif`;
                    ctx.textAlign = 'left';
                    ctx.fillText(
                        state.pendingHouse.isGoldenRoof ? `${t.name} (ЗОЛОТАЯ x2)` : t.name,
                        54,
                        botY + 18
                    );
                    ctx.fillStyle = '#FACC15';
                    ctx.font = `800 11px 'Trebuchet MS', sans-serif`;
                    ctx.fillText('НАЖМИ НА МИГАЮЩИЙ УЧАСТОК', 54, botY + 35);

                    drawArcadeButton('cancel_place', W - 92, botY + 6, 78, 36, 'ОТМЕНА', 'red', () => {
                        state.pendingHouse = null;
                        state.citySubMode = 'VIEW';
                    }, 11);
                } else {
                    const buildW = Math.min(230, W - 114);
                    const totalW = buildW + 86;
                    const startBtnX = (W - totalW) / 2;

                    drawArcadeButton('btn_open_build', startBtnX, botY, buildW, 48, 'ПОСТРОИТЬ ДОМ', 'gold', () => {
                        state.selectedLot = null;
                        state.citySubMode = 'SELECT_BUILDING';
                    }, 15);

                    const isDem = state.citySubMode === 'DEMOLISH';
                    drawArcadeButton('btn_demolish', startBtnX + buildW + 8, botY, 78, 48, isDem ? 'ОТМЕНА' : 'СНОС', isDem ? 'red' : 'dark', () => {
                        state.citySubMode = isDem ? 'VIEW' : 'DEMOLISH';
                        if (!isDem) showBanner('ВЫБЕРИ ДОМ ДЛЯ СНОСА', 2.0);
                    }, 12);
                }

                // =======================================
                // CLASSIC J2ME BUILDING SELECTOR MODAL
                // =======================================
                if (state.citySubMode === 'SELECT_BUILDING') {
                    renderBuildingSelectorOverlay();
                }
            }

            function drawCityLotBuilding(rect, cell, isDemolish) {
                const t = BUILDING_TYPES[cell.type];
                const lift = (cell.dropAnim || 0) * 34;
                const towerH = Math.min(rect.h * 0.65, 10 + cell.floors * 0.9);

                const bx = rect.x + rect.w * 0.14;
                const bw = rect.w * 0.72;
                const baseTop = rect.y + rect.h * 0.24 - lift;
                const bh = rect.h * 0.62;
                const roofTop = baseTop - towerH * 0.42;

                // Hard ground shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.42)';
                ctx.fillRect(bx + 4, rect.y + rect.h * 0.27, bw, bh);

                // Vertical facade body
                ctx.fillStyle = t.wallDark;
                ctx.fillRect(bx, roofTop, bw, bh + towerH * 0.42);

                // Top roof platform
                ctx.fillStyle = cell.isGoldenRoof ? '#FFD700' : t.wall;
                ctx.fillRect(bx, roofTop, bw, bh * 0.76);

                // Inner roof cap / Rooftop HVAC & Golden Spire
                const inset = bw * 0.18;
                ctx.fillStyle = cell.isGoldenRoof ? '#FFFBEB' : t.roof;
                ctx.fillRect(bx + inset, roofTop + inset * 0.8, bw - inset * 2, bh * 0.76 - inset * 1.6);

                if (cell.isGoldenRoof) {
                    // Golden center spire + periodic sparkle glint
                    ctx.fillStyle = '#F59E0B';
                    ctx.beginPath();
                    ctx.arc(bx + bw / 2, roofTop + bh * 0.38, bw * 0.15, 0, Math.PI * 2);
                    ctx.fill();

                    const glint = Math.max(0, Math.sin(state.animClock * 5 + rect.x));
                    if (glint > 0.75) {
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(bx + bw * 0.25, roofTop + bh * 0.2, 4, 4);
                    }
                } else {
                    // Classic rooftop vent / skylight box
                    ctx.fillStyle = t.trim;
                    ctx.fillRect(bx + inset + 3, roofTop + inset + 2, bw * 0.22, bh * 0.2);
                }

                // Crisp pixel border
                ctx.strokeStyle = isDemolish ? '#EF4444' : '#111827';
                ctx.lineWidth = isDemolish ? 3 : 2;
                ctx.strokeRect(bx, roofTop, bw, bh + towerH * 0.42);

                // Population tag bar at bottom of lot
                const tagH = Math.max(13, Math.round(rect.h * 0.22));
                const tagY = rect.y + rect.h - tagH - 2;
                ctx.fillStyle = '#111827';
                ctx.fillRect(rect.x + 4, tagY, rect.w - 8, tagH);

                ctx.fillStyle = cell.isGoldenRoof ? '#FFD700' : '#FFFFFF';
                ctx.font = `900 ${Math.max(9, Math.round(tagH * 0.74))}px 'Arial Black', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`${cell.finalPop}`, rect.x + rect.w / 2, tagY + tagH / 2 + 0.5);
            }

            function renderBuildingSelectorOverlay() {
                // Dim background
                ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                ctx.fillRect(0, 0, W, H);

                const modalW = Math.min(350, W - 20);
                const rowH = 62;
                const modalH = 62 + BUILDING_ORDER.length * (rowH + 8);
                const mx = Math.round((W - modalW) / 2);
                const my = Math.round((H - modalH) / 2);

                drawArcadeBox(mx, my, modalW, modalH, '#1E3A8A', '#0F172A', '#111827', '#FACC15');

                ctx.fillStyle = '#FACC15';
                ctx.font = `900 16px 'Arial Black', sans-serif`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText('ВЫБЕРИ ТИП ДОМА', mx + 14, my + 26);

                drawArcadeButton('close_selector', mx + modalW - 44, my + 8, 34, 34, 'X', 'red', () => {
                    state.citySubMode = 'VIEW';
                    state.selectedLot = null;
                }, 14);

                const stats = getCityStats();

                BUILDING_ORDER.forEach((typeId, idx) => {
                    const t = BUILDING_TYPES[typeId];
                    const ry = my + 50 + idx * (rowH + 8);
                    const rx = mx + 10;
                    const rw = modalW - 20;

                    const unlocked = stats.totalPop >= t.unlockPop;
                    const canPlace = state.selectedLot
                        ? evaluatePlacement(state.selectedLot.r, state.selectedLot.c, typeId).valid
                        : hasAnyValidTileForType(typeId);
                    const enabled = unlocked && canPlace;

                    drawArcadeBox(
                        rx,
                        ry,
                        rw,
                        rowH,
                        enabled ? '#F8FAFC' : '#64748B',
                        enabled ? '#CBD5E1' : '#475569',
                        '#111827',
                        enabled ? '#FFFFFF' : '#94A3B8'
                    );

                    drawMiniHouseIcon(rx + 28, ry + rowH / 2 + 2, t, false, 1.05);
                    if (!unlocked) {
                        drawLockIcon(rx + 28, ry + rowH / 2 + 4);
                    }

                    ctx.textAlign = 'left';
                    ctx.fillStyle = enabled ? '#111827' : '#E2E8F0';
                    ctx.font = `900 13px 'Arial Black', sans-serif`;
                    ctx.fillText(t.name, rx + 54, ry + 18);

                    ctx.fillStyle = enabled ? '#1E3A8A' : '#CBD5E1';
                    ctx.font = `800 11px 'Trebuchet MS', sans-serif`;
                    ctx.fillText(t.subtitle, rx + 54, ry + 35);

                    const statusMsg = !unlocked
                        ? `НУЖНО ${t.unlockPop} ЖИТЕЛЕЙ`
                        : !canPlace
                        ? t.ruleShort.toUpperCase()
                        : `УСЛОВИЕ: ${t.ruleShort.toUpperCase()}`;

                    ctx.fillStyle = enabled ? '#15803D' : '#FECACA';
                    ctx.font = `900 10px 'Arial Black', sans-serif`;
                    ctx.fillText(statusMsg, rx + 54, ry + 50);

                    if (enabled) {
                        registerHitbox(`pick_${typeId}`, rx, ry, rw, rowH, () => {
                            sfx.click();
                            state.citySubMode = 'VIEW';
                            startBuild(typeId, false);
                        });
                    }
                });
            }

            // =========================================================
            // 14. RENDER: TOWER BUILD SCREEN + GOLDEN ROOF TARGET ZONE
            // =========================================================
            function renderBuildScreen() {
                const b = state.build;
                const alt = b.cameraY;

                // Daylight -> Stratosphere -> Night Space Sky
                let cTop = '#0284C7';
                let cBot = '#BAE6FD';
                let starAlpha = 0;

                if (alt > 650 && alt <= 1750) {
                    const t = (alt - 650) / 1100;
                    cTop = lerpColor('#0284C7', '#1E3A8A', t);
                    cBot = lerpColor('#BAE6FD', '#60A5FA', t);
                } else if (alt > 1750) {
                    const t = Math.min(1, (alt - 1750) / 1200);
                    cTop = lerpColor('#1E3A8A', '#090D16', t);
                    cBot = lerpColor('#60A5FA', '#1E1B4B', t);
                    starAlpha = t * 0.9;
                }

                const sky = ctx.createLinearGradient(0, 0, 0, H);
                sky.addColorStop(0, cTop);
                sky.addColorStop(1, cBot);
                ctx.fillStyle = sky;
                ctx.fillRect(0, 0, W, H);

                if (starAlpha > 0.02) {
                    for (const s of state.stars) {
                        const tw = 0.5 + 0.5 * Math.sin(state.animClock * 4 + s.phase);
                        ctx.fillStyle = `rgba(255,255,255,${starAlpha * tw})`;
                        ctx.fillRect(s.x * W, s.y * H, s.r * 1.6, s.r * 1.6);
                    }
                }

                // Clouds
                for (const c of state.clouds) {
                    const cy = (H - 120 - c.alt) + b.cameraY * 0.65;
                    if (cy > -80 && cy < H + 80) {
                        drawCloud2005(c.x * W, cy, c.scale);
                    }
                }

                // Retro Pixel Seagulls / Birds flying in mid-sky
                for (const bird of state.birds) {
                    const by = (H - 120 - bird.alt) + b.cameraY * 0.72;
                    if (by > 40 && by < H - 80) {
                        const bx = bird.x * W;
                        const wing = Math.sin(bird.flap) * 4;
                        ctx.strokeStyle = '#111827';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(bx - 7, by - wing);
                        ctx.quadraticCurveTo(bx - 3, by - 4, bx, by);
                        ctx.quadraticCurveTo(bx + 3, by - 4, bx + 7, by - wing);
                        ctx.stroke();
                    }
                }

                // Ground Street
                const groundY = (H - 84) + b.cameraY;
                if (groundY < H + 150) {
                    drawBuildStreet(groundY);
                }

                // World Camera + Shake
                ctx.save();
                let sx = 0, sy = 0;
                if (b.shakeTime > 0) {
                    sx = (Math.random() - 0.5) * 2 * b.shakeMag;
                    sy = (Math.random() - 0.5) * 2 * b.shakeMag;
                }
                ctx.translate(sx, b.cameraY + sy);

                // Tower Blocks
                for (const blk of b.blocks) {
                    drawTowerBlock2005(blk, 0);
                }

                // Visual Golden Roof Target Zone on top floor when Roof is swinging!
                if (b.activeBlock && b.activeBlock.state === 'SWINGING') {
                    const ab = b.activeBlock;
                    const top = b.blocks[b.blocks.length - 1];
                    const supportW = top.isBase ? b.baseBlockW : top.w;
                    const centerTol = Math.max(9, Math.min(supportW, ab.w) * 0.11);
                    const aligned = Math.abs(ab.x - top.x) <= centerTol;

                    if (ab.isRoof) {
                        const topEdgeY = top.y - top.h / 2;
                        if (b.flawless) {
                            // Highlighted Golden Center Target Zone bar on the top floor
                            ctx.fillStyle = aligned ? '#FFD700' : 'rgba(255, 215, 0, 0.55)';
                            ctx.fillRect(top.x - centerTol, topEdgeY - 5, centerTol * 2, 5);
                            ctx.strokeStyle = '#111827';
                            ctx.lineWidth = 1.5;
                            ctx.strokeRect(top.x - centerTol, topEdgeY - 5, centerTol * 2, 5);
                        }
                    }

                    // Dotted drop guide
                    ctx.save();
                    ctx.setLineDash([5, 5]);
                    ctx.lineWidth = aligned ? 2.5 : 1.5;
                    ctx.strokeStyle = aligned ? '#FFD700' : 'rgba(255, 255, 255, 0.45)';
                    ctx.beginPath();
                    ctx.moveTo(ab.x, ab.y + ab.h / 2 + 3);
                    ctx.lineTo(ab.x, top.y - top.h / 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // Crane & Active Block
                drawCrane2005();
                if (b.activeBlock) {
                    drawTowerBlock2005(b.activeBlock, b.activeBlock.angle || 0);
                }

                // Falling Blocks
                for (const fb of b.fallingBlocks) {
                    drawTowerBlock2005(fb, fb.angle);
                }

                // Sheared Overhang Masonry Debris Chunks
                for (const dc of b.debrisChunks) {
                    ctx.save();
                    ctx.translate(dc.x, dc.y);
                    ctx.rotate(dc.angle);
                    ctx.fillStyle = dc.color;
                    ctx.fillRect(-dc.w / 2, -dc.h / 2, dc.w, dc.h);
                    ctx.fillStyle = dc.trimColor;
                    ctx.fillRect(-dc.w / 2, -dc.h / 2, dc.w, Math.max(2, dc.h * 0.28));
                    ctx.strokeStyle = '#111827';
                    ctx.lineWidth = 1.8;
                    ctx.strokeRect(-dc.w / 2, -dc.h / 2, dc.w, dc.h);
                    ctx.restore();
                }

                // Parachuting Citizens
                for (const p of b.parachutists) {
                    drawParachuteCitizen(p);
                }

                ctx.restore();

                // =======================================
                // TOP J2ME BUILD HUD BAR
                // =======================================
                drawArcadeBox(6, 6, W - 12, 52, '#1E3A8A', '#0F172A', '#111827', '#FACC15');

                // Residents / Score Counter
                drawPixelPersonIcon(24, 31, 1.0);
                ctx.fillStyle = '#FACC15';
                ctx.font = `900 16px 'Arial Black', sans-serif`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(b.isQuickPlay ? `${b.score}` : `${b.residents}`, 39, 32);

                // Floor Counter Badge (e.g. 05/10 or КРЫША!)
                const floorText = b.isQuickPlay
                    ? `${b.blocks.length} ЭТ`
                    : b.roofPhase
                    ? 'КРЫША!'
                    : `${String(b.blocks.length).padStart(2, '0')}/${b.tier.floors}`;

                const badgeX = Math.min(116, W * 0.31);
                ctx.fillStyle = b.roofPhase ? '#FFD700' : '#020617';
                ctx.fillRect(badgeX, 17, 74, 30);
                ctx.strokeStyle = '#94A3B8';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(badgeX, 17, 74, 30);

                ctx.fillStyle = b.roofPhase ? '#111827' : '#FFFFFF';
                ctx.font = `900 12px 'Arial Black', sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(floorText, badgeX + 37, 32);

                // 3 Classic Red Hearts
                const heartsStartX = W - 144;
                for (let i = 0; i < 3; i++) {
                    drawPixelHeartIcon(heartsStartX + i * 22, 32, i < b.lives, 0.92);
                }

                // Sound & Exit buttons
                drawArcadeButton('build_mute', W - 78, 13, 34, 38, '', 'dark', () => {
                    sfx.toggleMute();
                });
                drawSoundIcon(W - 61, 32, sfx.muted);

                drawArcadeButton('build_exit', W - 40, 13, 28, 38, 'X', 'red', () => {
                    if (b.isQuickPlay) {
                        state.mode = 'TITLE';
                    } else {
                        state.mode = 'CITY';
                        state.citySubMode = 'VIEW';
                    }
                }, 13);

                // Combo / Golden Roof Hint Strip under HUD
                if (b.roofPhase && !b.failed && b.completeTimer <= 0) {
                    const tagW = Math.min(286, W - 24);
                    if (b.flawless) {
                        drawArcadeBox((W - tagW) / 2, 64, tagW, 26, '#FFD700', '#F59E0B', '#111827', '#FFFBEB');
                        ctx.fillStyle = '#111827';
                        ctx.font = `900 10px 'Arial Black', sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.fillText('ДОМ БЕЗ ОШИБОК! ПОПАДИ В ЦЕНТР ДЛЯ ЗОЛОТА x2', W / 2, 77);
                    } else {
                        drawArcadeBox((W - tagW) / 2, 64, tagW, 26, '#334155', '#1E293B', '#111827', '#94A3B8');
                        ctx.fillStyle = '#F8FAFC';
                        ctx.font = `900 10px 'Arial Black', sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.fillText('УСТАНОВИТЕ КРЫШУ НА ДОМ', W / 2, 77);
                    }
                } else if (b.combo >= 2) {
                    drawArcadeBox(10, 64, 126, 26, '#FACC15', '#EA580C', '#111827', '#FEF08A');
                    ctx.fillStyle = '#111827';
                    ctx.font = `900 12px 'Arial Black', sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText(`КОМБО x${b.combo}`, 73, 77);
                }

                // =======================================
                // GAME OVER MODAL (CLASSIC J2ME DIALOG)
                // =======================================
                if (b.failed) {
                    renderBuildFailedOverlay();
                }
            }

            function drawBuildStreet(groundY) {
                // Background buildings
                const bg = [
                    { x: 0.03, w: 0.14, h: 130, c: '#3B82F6' },
                    { x: 0.16, w: 0.12, h: 175, c: '#60A5FA' },
                    { x: 0.70, w: 0.13, h: 160, c: '#60A5FA' },
                    { x: 0.82, w: 0.15, h: 120, c: '#3B82F6' }
                ];
                bg.forEach(s => {
                    ctx.fillStyle = s.c;
                    ctx.strokeStyle = '#1E3A8A';
                    ctx.lineWidth = 2;
                    ctx.fillRect(s.x * W, groundY - s.h, s.w * W, s.h);
                    ctx.strokeRect(s.x * W, groundY - s.h, s.w * W, s.h);
                });

                // Grass strip
                ctx.fillStyle = '#16A34A';
                ctx.fillRect(0, groundY, W, 18);
                ctx.strokeStyle = '#111827';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.lineTo(W, groundY);
                ctx.stroke();

                // Road
                ctx.fillStyle = '#334155';
                ctx.fillRect(0, groundY + 18, W, 66);
                ctx.fillStyle = '#FACC15';
                for (let x = 14; x < W; x += 54) {
                    ctx.fillRect(x, groundY + 46, 26, 5);
                }

                // Concrete foundation slab
                const padW = Math.min(210, W * 0.45);
                ctx.fillStyle = '#CBD5E1';
                ctx.strokeStyle = '#111827';
                ctx.lineWidth = 2.5;
                ctx.fillRect(W / 2 - padW / 2, groundY - 6, padW, 12);
                ctx.strokeRect(W / 2 - padW / 2, groundY - 6, padW, 12);
            }

            function drawCrane2005() {
                const b = state.build;
                const px = W / 2;
                const py = -b.cameraY + 66;
                const halfBoom = Math.min(W * 0.44, 195);

                ctx.save();
                // Full-width Horizontal Crane Boom & Rail
                ctx.fillStyle = '#FACC15';
                ctx.strokeStyle = '#111827';
                ctx.lineWidth = 2.5;
                ctx.fillRect(px - halfBoom, py - 14, halfBoom * 2, 14);
                ctx.strokeRect(px - halfBoom, py - 14, halfBoom * 2, 14);

                // Red Truss Zigzag along the entire boom
                ctx.strokeStyle = '#DC2626';
                ctx.lineWidth = 2.6;
                ctx.beginPath();
                const step = 16;
                let tx = px - halfBoom + 8;
                let up = false;
                ctx.moveTo(tx, py - 2);
                while (tx + step <= px + halfBoom - 8) {
                    tx += step;
                    up = !up;
                    ctx.lineTo(tx, up ? py - 12 : py - 2);
                }
                ctx.stroke();

                // End Stopper Bumpers on Boom
                ctx.fillStyle = '#DC2626';
                ctx.fillRect(px - halfBoom - 3, py - 16, 6, 18);
                ctx.strokeRect(px - halfBoom - 3, py - 16, 6, 18);
                ctx.fillRect(px + halfBoom - 3, py - 16, 6, 18);
                ctx.strokeRect(px + halfBoom - 3, py - 16, 6, 18);

                // Trolley Carriage X position (follows active block while riding, or center when dropping)
                const trolleyX = (b.activeBlock && b.activeBlock.state === 'SWINGING')
                    ? b.activeBlock.x
                    : px + b.crane.angle * Math.min(W * 0.34, 155);

                // Rolling Trolley Carriage on the Rail
                ctx.fillStyle = '#1E293B';
                ctx.fillRect(trolleyX - 14, py - 17, 28, 20);
                ctx.strokeRect(trolleyX - 14, py - 17, 28, 20);

                // Trolley Wheels
                ctx.fillStyle = '#FACC15';
                ctx.beginPath();
                ctx.arc(trolleyX - 8, py - 7, 3.5, 0, Math.PI * 2);
                ctx.arc(trolleyX + 8, py - 7, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                if (b.activeBlock && b.activeBlock.state === 'SWINGING') {
                    const ab = b.activeBlock;
                    const hx = ab.x;
                    const hy = ab.y - ab.h / 2;

                    // Straight Vertical Hoist Cable from Trolley
                    ctx.strokeStyle = '#111827';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(trolleyX, py + 3);
                    ctx.lineTo(hx, hy);
                    ctx.stroke();

                    ctx.strokeStyle = '#F8FAFC';
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.moveTo(trolleyX, py + 3);
                    ctx.lineTo(hx, hy);
                    ctx.stroke();

                    // Claw Hook
                    ctx.fillStyle = '#FACC15';
                    ctx.strokeStyle = '#111827';
                    ctx.lineWidth = 2;
                    ctx.fillRect(hx - 7, hy - 6, 14, 7);
                    ctx.strokeRect(hx - 7, hy - 6, 14, 7);
                }
                ctx.restore();
            }

            function drawParachuteCitizen(p) {
                ctx.save();
                ctx.translate(p.x, p.y);

                // Canopy
                ctx.fillStyle = p.canopy;
                ctx.strokeStyle = '#111827';
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.arc(0, -17, 11, Math.PI, 0, false);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Lines
                ctx.strokeStyle = '#111827';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(-9, -17);
                ctx.lineTo(-2, -5);
                ctx.moveTo(9, -17);
                ctx.lineTo(2, -5);
                ctx.stroke();

                // Body & Head
                ctx.fillStyle = p.shirt;
                ctx.fillRect(-3, -5, 6, 6);
                ctx.fillStyle = '#FFE0B2';
                ctx.beginPath();
                ctx.arc(0, -8, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            }

            function renderBuildFailedOverlay() {
                const b = state.build;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                ctx.fillRect(0, 0, W, H);

                const mw = Math.min(310, W - 32);
                const mh = 230;
                const mx = (W - mw) / 2;
                const my = (H - mh) / 2;

                drawArcadeBox(mx, my, mw, mh, '#1E3A8A', '#0F172A', '#111827', '#EF4444');

                ctx.fillStyle = '#FF5252';
                ctx.font = `900 22px 'Arial Black', sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText('СТРОЙКА ПРЕРВАНА', W / 2, my + 34);

                ctx.fillStyle = '#E2E8F0';
                ctx.font = `800 13px 'Trebuchet MS', sans-serif`;
                ctx.fillText(
                    b.isQuickPlay
                        ? `СЧЁТ: ${b.score}  •  ЭТАЖЕЙ: ${b.blocks.length}`
                        : `ПОСТРОЕНО: ${b.blocks.length}/${b.tier.floors} ЭТАЖЕЙ`,
                    W / 2,
                    my + 68
                );

                drawArcadeButton('retry_build', mx + 18, my + 98, mw - 36, 48, 'ПОПРОБОВАТЬ СНОВА', 'gold', () => {
                    startBuild(b.tier.id, b.isQuickPlay);
                }, 14);

                drawArcadeButton(
                    'abort_build',
                    mx + 18,
                    my + 158,
                    mw - 36,
                    44,
                    b.isQuickPlay ? 'В ГЛАВНОЕ МЕНЮ' : 'НА КАРТУ ГОРОДА',
                    'blue',
                    () => {
                        if (b.isQuickPlay) {
                            state.mode = 'TITLE';
                        } else {
                            state.mode = 'CITY';
                            state.citySubMode = 'VIEW';
                        }
                    },
                    14
                );
            }

            function lerpColor(a, b, t) {
                const c1 = parseInt(a.slice(1), 16);
                const c2 = parseInt(b.slice(1), 16);
                const r = Math.round(((c1 >> 16) & 255) * (1 - t) + ((c2 >> 16) & 255) * t);
                const g = Math.round(((c1 >> 8) & 255) * (1 - t) + ((c2 >> 8) & 255) * t);
                const bl = Math.round((c1 & 255) * (1 - t) + (c2 & 255) * t);
                return `rgb(${r},${g},${bl})`;
            }

            // =========================================================
            // 15. MASTER RENDER PASS
            // =========================================================
            function render() {
                state.hitboxes = [];
                ctx.clearRect(0, 0, W, H);

                if (state.mode === 'TITLE') {
                    renderTitleScreen();
                } else if (state.mode === 'CITY') {
                    renderCityScreen();
                } else if (state.mode === 'BUILD') {
                    renderBuildScreen();
                }

                // Render Particles & Floating Popups
                ctx.save();
                if (state.mode === 'BUILD') {
                    ctx.translate(0, state.build.cameraY);
                }

                for (const p of state.particles) {
                    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
                    ctx.strokeStyle = '#111827';
                    ctx.lineWidth = 1.2;
                    ctx.strokeRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
                }
                ctx.globalAlpha = 1;

                for (const f of state.popups) {
                    ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.5));
                    ctx.font = `900 ${Math.round(18 * f.scale)}px 'Arial Black', Impact, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#111827';
                    ctx.fillText(f.text, f.x + 2, f.y + 2);
                    ctx.fillStyle = f.color;
                    ctx.fillText(f.text, f.x, f.y);
                }
                ctx.restore();

                // Top-Center Arcade Toast Banner (when active)
                if (state.toastTimer > 0 && state.toastText) {
                    const tw = Math.min(320, W - 24);
                    const tx = (W - tw) / 2;
                    const ty = state.mode === 'CITY' ? 66 : 96;
                    drawArcadeBox(tx, ty, tw, 32, '#0F172A', '#1E293B', '#111827', '#FACC15');
                    ctx.fillStyle = '#FACC15';
                    ctx.font = `900 11px 'Arial Black', sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(state.toastText, W / 2, ty + 16);
                }
            }

            // =========================================================
            // 16. UNIFIED POINTER & KEYBOARD INPUTS
            // =========================================================
            canvas.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                sfx.init();

                const rect = canvas.getBoundingClientRect();
                const px = e.clientX - rect.left;
                const py = e.clientY - rect.top;

                // Check registered UI hitboxes from top-most to bottom-most
                for (let i = state.hitboxes.length - 1; i >= 0; i--) {
                    const hb = state.hitboxes[i];
                    if (px >= hb.x && px <= hb.x + hb.w && py >= hb.y && py <= hb.y + hb.h) {
                        hb.onClick();
                        return;
                    }
                }

                // Otherwise, if in BUILD mode, release swinging block!
                if (state.mode === 'BUILD') {
                    dropBlock();
                }
            });

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'Enter') {
                    if (state.mode === 'BUILD') {
                        e.preventDefault();
                        sfx.init();
                        dropBlock();
                    }
                }
            });

            // =========================================================
            // 17. MAIN GAME LOOP
            // =========================================================
            function loop(ts) {
                if (!state.lastTime) state.lastTime = ts;
                const dt = Math.min(0.05, (ts - state.lastTime) / 1000);
                state.lastTime = ts;

                update(dt);
                render();

                requestAnimationFrame(loop);
            }

            window.onload = function () {
                requestAnimationFrame(loop);
            };
        })();
    </script>
</body>
</html>
