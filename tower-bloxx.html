<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0F4C81">
    <title>TOWER BLOXX — City Bloxx 2005</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0B3960;
            font-family: 'Arial Black', 'Impact', 'Trebuchet MS', Arial, sans-serif;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        /**
         * TOWER BLOXX (CITY BLOXX) — Classic 2005 J2ME / Digital Chocolate Style + Developer Tycoon
         * Features:
         *  - Developer Budget ($), construction costs per building tier & capacity (Max Residents)
         *  - Newly built houses start with 0 residents: citizens move in organically over time (earning $)
         *    OR you can force-sell apartments via the "AVITO BARGAIN" slider mini-game!
         *  - Demolition requires Relocation (move citizens to free capacity in another house — with upcharge if
         *    new house is better, or refusal -> Compensation or COURT mini-game!) or direct Compensation.
         *  - Court Defense Mini-Game: win = pay $0; lose = pay compensation + 25% penalty.
         *  - Bankruptcy screen if balance < 0 (restart or watch simulated ad for 50% debt relief).
         *  - Second City ("ГОРОД-ОЗЕРО" O-shaped ring around a central lake) purchasable & switchable!
         */
        (() => {
            // =========================================================
            // 1. CANVAS & RESPONSIVE DPR SETUP
            // =========================================================
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            let W = window.innerWidth;
            let H = window.innerHeight;
            let dpr = Math.min(window.devicePixelRatio || 1, 2);

            function resizeCanvas() {
                W = window.innerWidth;
                H = window.innerHeight;
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = Math.floor(W * dpr);
                canvas.height = Math.floor(H * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // =========================================================
            // 2. RETRO 2005 J2ME CHIPTUNE AUDIO (WEB AUDIO API)
            // =========================================================
            const sfx = {
                ctx: null,
                muted: false,
                init() {
                    if (!this.ctx) {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (AudioCtx) this.ctx = new AudioCtx();
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume().catch(() => {});
                    }
                },
                toggleMute() {
                    this.muted = !this.muted;
                },
                tone(freq, type, duration, vol = 0.14, delay = 0, slideTo = null) {
                    if (this.muted || !this.ctx) return;
                    try {
                        const t0 = this.ctx.currentTime + delay;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = type;
                        osc.frequency.setValueAtTime(freq, t0);
                        if (slideTo) {
                            osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + duration);
                        }
                        gain.gain.setValueAtTime(vol, t0);
                        gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(t0);
                        osc.stop(t0 + duration + 0.01);
                    } catch (e) {}
                },
                click() {
                    this.tone(660, 'square', 0.055, 0.10);
                },
                cash() {
                    this.tone(880, 'square', 0.07, 0.12, 0);
                    this.tone(1174.66, 'square', 0.14, 0.14, 0.06);
                },
                drop() {
                    this.tone(360, 'triangle', 0.11, 0.13, 0, 170);
                },
                land() {
                    this.tone(150, 'square', 0.09, 0.16, 0, 75);
                },
                crumble() {
                    this.tone(190, 'sawtooth', 0.13, 0.16, 0, 70);
                    this.tone(130, 'square', 0.16, 0.14, 0.04, 52);
                },
                perfect(combo) {
                    const base = 523.25 * Math.pow(1.06, Math.min(combo, 7));
                    this.tone(base, 'square', 0.08, 0.13, 0);
                    this.tone(base * 1.25, 'square', 0.08, 0.13, 0.06);
                    this.tone(base * 1.5, 'square', 0.14, 0.15, 0.12);
                },
                standardRoof() {
                    this.tone(440, 'square', 0.10, 0.14, 0);
                    this.tone(554.37, 'square', 0.10, 0.14, 0.08);
                    this.tone(659.25, 'square', 0.22, 0.16, 0.16);
                },
                goldenRoof() {
                    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
                    notes.forEach((n, idx) => {
                        this.tone(n, 'square', 0.14, 0.16, idx * 0.075);
                    });
                },
                chuteLand() {
                    this.tone(880, 'triangle', 0.06, 0.07, 0, 1180);
                },
                miss() {
                    this.tone(240, 'sawtooth', 0.18, 0.18, 0, 85);
                    this.tone(170, 'sawtooth', 0.24, 0.18, 0.12, 60);
                },
                cityPlace(isGolden) {
                    this.tone(392, 'square', 0.09, 0.14, 0);
                    this.tone(523.25, 'square', 0.10, 0.14, 0.07);
                    this.tone(659.25, 'square', 0.12, 0.15, 0.14);
                    if (isGolden) {
                        this.tone(1046.5, 'square', 0.22, 0.16, 0.22);
                    }
                }
            };

            // =========================================================
            // 3. CLASSIC 2005 BUILDING TIERS, COSTS & CITIES
            // =========================================================
            const GRID_SIZE = 5;
            const STORAGE_KEY = 'tower_bloxx_2005_tycoon_v2';

            const BUILDING_TYPES = {
                blue: {
                    id: 'blue',
                    tierRank: 1,
                    name: 'ЖИЛОЙ ДОМ',
                    subtitle: '10 ЭТ. • СТОИМОСТЬ $150',
                    ruleShort: 'ЛЮБОЙ СВОБОДНЫЙ УЧАСТОК',
                    floors: 10,
                    buildCost: 150,
                    pricePerResident: 2, // $ за каждого заселившегося жителя
                    compPerResident: 6,  // $ компенсации при сносе
                    multiplier: 1.0,
                    unlockPop: 0,
                    wall: '#2979FF',
                    wallLight: '#82B1FF',
                    wallDark: '#1565C0',
                    roof: '#0D47A1',
                    roofLight: '#448AFF',
                    trim: '#E3F2FD',
                    windowOff: '#102A43',
                    windowLit: '#FFF176'
                },
                red: {
                    id: 'red',
                    tierRank: 2,
                    name: 'ТОРГОВЫЙ ДОМ',
                    subtitle: '15 ЭТ. • СТОИМОСТЬ $450',
                    ruleShort: 'РЯДОМ С СИНИМ ДОМОМ',
                    floors: 15,
                    buildCost: 450,
                    pricePerResident: 3,
                    compPerResident: 9,
                    multiplier: 1.5,
                    unlockPop: 100,
                    wall: '#E53935',
                    wallLight: '#FF8A80',
                    wallDark: '#B71C1C',
                    roof: '#7F0000',
                    roofLight: '#FF5252',
                    trim: '#FFEBEE',
                    windowOff: '#2B0909',
                    windowLit: '#FFF59D'
                },
                green: {
                    id: 'green',
                    tierRank: 3,
                    name: 'ОФИСНЫЙ ЦЕНТР',
                    subtitle: '20 ЭТ. • СТОИМОСТЬ $1100',
                    ruleShort: 'РЯДОМ С СИНИМ И КРАСНЫМ',
                    floors: 20,
                    buildCost: 1100,
                    pricePerResident: 5,
                    compPerResident: 14,
                    multiplier: 2.0,
                    unlockPop: 350,
                    wall: '#00A859',
                    wallLight: '#69F0AE',
                    wallDark: '#006937',
                    roof: '#004D26',
                    roofLight: '#00E676',

                    windowLit: '#FFFF8D'
                },
                yellow: {
                    id: 'yellow',
                    tierRank: 4,
                    name: 'МЕГА-БАШНЯ',
                    subtitle: '25 ЭТ. • СТОИМОСТЬ $2500',
                    ruleShort: 'РЯДОМ С СИНИМ, КРАСНЫМ, ЗЕЛ.',
                    floors: 25,
                    buildCost: 2500,
                    pricePerResident: 7,
                    compPerResident: 20,
                    multiplier: 3.0,
                    unlockPop: 900,
                    wall: '#FFB300',
                    wallLight: '#FFE57F',
                    wallDark: '#E65100',
                    roof: '#BF360C',
                    roofLight: '#FFD740',
                    trim: '#FFFDE7',
                    windowOff: '#2E1A05',
                    windowLit: '#FFFFFF'
                }
            };
            const BUILDING_ORDER = ['blue', 'red', 'green', 'yellow'];

            // Второй город (формой буквы "О" с большим озером внутри)
            const CITY2_REQ_POP = 600;
            const CITY2_REQ_MONEY = 3000;

            function isCellLakeInCity(cityIdx, r, c) {
                if (cityIdx !== 1) return false;
                // Внутренний квадрат 3x3 (строки 1..3, столбцы 1..3) — это озеро внутри буквы "О"!
                return r >= 1 && r <= 3 && c >= 1 && c <= 3;
            }

            // =========================================================
            // 4. PERSISTENCE (GOOGLE SITES SAFE STORAGE)
            // =========================================================
            const memoryFallbackStore = {};

            function safeGetItem(key) {
                try {
                    const val = window.localStorage.getItem(key);
                    if (val !== null) return val;
                } catch (e) {}
                try {
                    if (window.name && window.name.startsWith('TB_STATE:')) {
                        const bundle = JSON.parse(window.name.slice(9));
                        if (bundle && key in bundle) return bundle[key];
                    }
                } catch (e) {}
                return key in memoryFallbackStore ? memoryFallbackStore[key] : null;
            }

            function safeSetItem(key, val) {
                memoryFallbackStore[key] = val;
                try {
                    window.localStorage.setItem(key, val);
                } catch (e) {}
                try {
                    let bundle = {};
                    if (window.name && window.name.startsWith('TB_STATE:')) {
                        bundle = JSON.parse(window.name.slice(9)) || {};
                    }
                    bundle[key] = val;
                    window.name = 'TB_STATE:' + JSON.stringify(bundle);
                } catch (e) {}
            }

            function createEmptyGrid() {
                return Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(null));
            }

            function createInitialSaveData() {
                const g0 = createEmptyGrid();
                // Стартовый синий дом уже заселён, чтобы сразу были соседи для правил и стартовый доход
                g0[2][2] = {
                    type: 'blue',
                    floors: 10,
                    isGoldenRoof: false,
                    baseResidents: 100,
                    maxPop: 100,
                    currentPop: 60,
                    dropAnim: 0
                };
                return {
                    money: 450,
                    activeCity: 0,
                    city2Unlocked: false,
                    grids: [g0, createEmptyGrid()]
                };
            }

            function normalizeCell(cell) {
                if (!cell) return null;
                const maxP = cell.maxPop ?? cell.finalPop ?? 100;
                const curP = cell.currentPop !== undefined ? Math.min(maxP, cell.currentPop) : 0;
                return {
                    type: cell.type || 'blue',
                    floors: cell.floors || 10,
                    isGoldenRoof: !!cell.isGoldenRoof,
                    baseResidents: cell.baseResidents || 100,
                    maxPop: maxP,
                    currentPop: curP,
                    dropAnim: 0
                };
            }

            function loadGameSave() {
                try {
                    const raw = safeGetItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed && Array.isArray(parsed.grids) && parsed.grids.length === 2) {
                            return {
                                money: typeof parsed.money === 'number' ? parsed.money : 450,
                                activeCity: parsed.activeCity === 1 ? 1 : 0,
                                city2Unlocked: !!parsed.city2Unlocked,
                                grids: parsed.grids.map(g =>
                                    g.map(row => row.map(c => normalizeCell(c)))
                                )
                            };
                        }
                    }
                } catch (e) {}
                return createInitialSaveData();
            }

            const initialData = loadGameSave();

            // =========================================================
            // 5. GLOBAL GAME STATE & SCENERY DATA
            // =========================================================
            const state = {
                mode: 'TITLE', // 'TITLE' | 'CITY' | 'BUILD'
                citySubMode: 'VIEW', // 'VIEW' | 'SELECT_BUILDING' | 'PLACING' | 'DEMOLISH' | 'HOUSE_MENU' | 'AVITO' | 'RELOCATE_PICK' | 'RELOCATE_RESULT' | 'COURT' | 'BANKRUPT' | 'AD_WATCH'
                money: initialData.money,
                activeCity: initialData.activeCity, // 0 = Стартовый город, 1 = Город-Озеро (буквой О)
                city2Unlocked: initialData.city2Unlocked,
                grids: initialData.grids,
                get cityGrid() {
                    return this.grids[this.activeCity];
                },
                set cityGrid(val) {
                    this.grids[this.activeCity] = val;
                },

                selectedLot: null,
                inspectLot: null, // { r, c } открытый дом для продажи на Авито или сноса
                pendingHouse: null,
                resetConfirm: false,
                toastText: '',
                toastTimer: 0,
                autoMoveTimer: 0,

                // Мини-игра 1: Авито-торг на прямой
                avito: {
                    r: 0,
                    c: 0,
                    round: 1,
                    maxRounds: 4,
                    hits: 0,
                    misses: 0,
                    maxMisses: 2,
                    cursorPos: 0.15,
                    cursorDir: 1,
                    cursorSpeed: 1.05,
                    targetCenter: 0.5,
                    targetWidth: 0.24,
                    flashTimer: 0,
                    flashText: '',
                    flashGood: true
                },

                // Мини-игра 2: Суд с отказниками (3 разных сложных этапа)
                court: {
                    baseDebt: 0,
                    stage: 1, // 1 = Встречный иск (подвижная зона + быстрый маркер), 2 = Перекрёстный допрос (3 замка подряд), 3 = Приговор судьи (таймер + двойной встречный бегунок)
                    stageTitle: '',
                    // Этап 1: Узкая бегающая зона + быстрый маятник
                    markerPos: 0.1,
                    markerDir: 1,
                    markerSpeed: 2.05,
                    zoneCenter: 0.5,
                    zoneDir: -1,
                    zoneSpeed: 0.42,
                    zoneWidth: 0.13,
                    // Этап 2: 3 последовательные печати/аргумента с ускорением
                    s2Step: 0,
                    s2Pos: 0.05,
                    s2Dir: 1,
                    s2Speed: 2.35,
                    s2Targets: [0.24, 0.72, 0.48],
                    s2Tol: 0.075,
                    // Этап 3: Синхронизация 2 встречных бегунков на жёстком таймере
                    s3TimeLeft: 4.5,
                    s3MaxTime: 4.5,
                    s3TopPos: 0.08,
                    s3TopDir: 1,
                    s3TopSpeed: 2.25,
                    s3BotPos: 0.92,
                    s3BotDir: -1,
                    s3BotSpeed: 2.85,
                    s3Center: 0.5,
                    s3HalfWidth: 0.09,
                    // Итоги и вспышки
                    flashTimer: 0,
                    flashText: '',
                    flashGood: true,
                    finished: false,
                    won: false,
                    resultTimer: 0
                },

                // Имитация антикризисной рекламы при банкротстве
                adWatch: {
                    debtAmount: 0,
                    timer: 0,
                    duration: 3.5
                },

                hitboxes: [],

                cars: [],
                streetCars: [],
                pedestrians: [],
                clouds: [],
                blimp: { x: 0.2, alt: 320, speed: 0.015 },
                birds: [],
                stars: [],
                skylineBack: [],
                skylineFront: [],
                parkTrees: [],
                meadowFlowers: [],
                particles: [],
                popups: [],

                reloc: null,
                animClock: 0,
                lastTime: 0,

                build: {
                    tier: BUILDING_TYPES.blue,
                    isQuickPlay: false,
                    residents: 10,
                    score: 100,
                    lives: 3,
                    combo: 0,
                    flawless: true,
                    baseBlockW: 100,
                    isGoldenRoof: false,
                    roofPhase: false,
                    failed: false,
                    completeTimer: 0,
                    cameraY: 0,
                    targetCameraY: 0,
                    shakeTime: 0,
                    shakeMag: 0,
                    blocks: [],
                    activeBlock: null,
                    fallingBlocks: [],
                    debrisChunks: [],
                    parachutists: [],
                    crane: {
                        angle: 0,
                        time: 0,
                        speed: 2.3,
                        maxAngle: 0.85,
                        ropeLen: 52
                    }
                }
            };

            function saveGrid() {
                try {
                    safeSetItem(STORAGE_KEY, JSON.stringify({
                        money: state.money,
                        activeCity: state.activeCity,
                        city2Unlocked: state.city2Unlocked,
                        grids: state.grids
                    }));
                } catch (e) {}
            }

            function initScenery() {
                state.clouds = Array.from({ length: 12 }, (_, i) => ({
                    x: (i * 0.19) % 1.2 - 0.1,
                    alt: 110 + i * 195,
                    scale: 0.7 + (i % 3) * 0.22,
                    speed: (i % 2 === 0 ? 1 : -1) * (0.012 + (i % 4) * 0.004)
                }));

                state.birds = Array.from({ length: 6 }, (_, i) => ({
                    x: (i * 0.23) % 1.1,
                    alt: 160 + i * 260,
                    speed: (i % 2 === 0 ? 1 : -1) * (0.045 + (i % 3) * 0.015),
                    flap: i * 1.1
                }));

                state.stars = Array.from({ length: 45 }, (_, i) => ({
                    x: ((i * 73) % 100) / 100,
                    y: ((i * 41) % 75) / 100,
                    r: 1 + (i % 2),
                    phase: i * 0.7
                }));

                const backCols = [
                    { c: '#3B82F6', side: '#1D4ED8' },
                    { c: '#6366F1', side: '#4338CA' },
                    { c: '#0EA5E9', side: '#0369A1' }
                ];
                state.skylineBack = Array.from({ length: 11 }, (_, i) => {
                    const pal = backCols[i % backCols.length];
                    return {
                        x: i * 0.095 - 0.02,
                        w: 0.085 + (i % 3) * 0.015,
                        h: 95 + ((i * 37) % 85),
                        c: pal.c,
                        side: pal.side,
                        spire: i % 3 === 1,
                        litSeed: i + 1
                    };
                });

                const frontCols = [
                    { c: '#1E40AF', side: '#172554' },
                    { c: '#334155', side: '#0F172A' },
                    { c: '#0F766E', side: '#115E59' }
                ];
                state.skylineFront = Array.from({ length: 9 }, (_, i) => {
                    const pal = frontCols[i % frontCols.length];
                    return {
                        x: i * 0.118 - 0.01,
                        w: 0.095 + (i % 2) * 0.02,
                        h: 65 + ((i * 29) % 65),
                        c: pal.c,
                        side: pal.side,
                        roofType: i % 3 === 0 ? 'watertower' : (i % 3 === 1 ? 'antenna' : 'flat'),
                        litSeed: i + 5
                    };
                });

                const carColors = ['#EF4444', '#FACC15', '#38BDF8', '#FFFFFF', '#F97316'];
                state.streetCars = Array.from({ length: 5 }, (_, i) => ({
                    x: (i * 0.24) % 1.2 - 0.1,
                    dir: i % 2 === 0 ? 1 : -1,
                    speed: (i % 2 === 0 ? 1 : -1) * (0.11 + (i % 3) * 0.03),
                    color: carColors[i % carColors.length]
                }));

                state.cars = Array.from({ length: 8 }, (_, i) => ({
                    axis: i % 2 === 0 ? 'h' : 'v',
                    road: i % (GRID_SIZE + 1),
                    t: (i * 0.17) % 1.0,
                    v: (i % 2 === 0 ? 1 : -1) * (0.09 + (i % 3) * 0.025),
                    color: carColors[i % carColors.length]
                }));

                const shirts = ['#EF4444', '#3B82F6', '#FACC15', '#FFFFFF', '#EC4899'];
                state.pedestrians = Array.from({ length: 10 }, (_, i) => ({
                    axis: i % 2 === 0 ? 'h' : 'v',
                    road: (i + 1) % (GRID_SIZE + 1),
                    side: i % 2 === 0 ? -1 : 1,
                    t: (i * 0.13) % 1.0,
                    v: (i % 3 === 0 ? -1 : 1) * 0.045,
                    shirt: shirts[i % shirts.length]
                }));

                state.parkTrees = [
                    { nx: 0.05, ny: 0.16, s: 0.9, pine: false },
                    { nx: 0.08, ny: 0.28, s: 1.05, pine: true },
                    { nx: 0.04, ny: 0.45, s: 0.85, pine: false },
                    { nx: 0.07, ny: 0.78, s: 1.0, pine: true },
                    { nx: 0.94, ny: 0.18, s: 0.95, pine: true },
                    { nx: 0.95, ny: 0.50, s: 0.9, pine: false },
                    { nx: 0.93, ny: 0.80, s: 1.05, pine: false },
                    { nx: 0.22, ny: 0.88, s: 0.85, pine: true },
                    { nx: 0.78, ny: 0.88, s: 0.9, pine: false }
                ];

                const fCols = ['#FEF08A', '#F472B6', '#FFFFFF', '#38BDF8'];
                state.meadowFlowers = Array.from({ length: 28 }, (_, i) => ({
                    fx: ((i * 37 + 11) % 96 + 2) / 100,
                    fy: ((i * 53 + 17) % 82 + 9) / 100,
                    col1: fCols[i % fCols.length],
                    col2: fCols[(i + 1) % fCols.length],
                    hasBush: i % 4 === 0
                }));
            }
            initScenery();

            function showBanner(msg, dur = 2.0) {
                state.toastText = msg;
                state.toastTimer = dur;
            }

            // =========================================================
            // 6. ECONOMY, ADJACENCY, GOLDEN ROOF & STATS
            // =========================================================
            function checkBankruptcy() {
                if (state.money < 0) {
                    state.citySubMode = 'BANKRUPT';
                    saveGrid();
                    return true;
                }
                return false;
            }

            function getNeighbors(r, c) {
                const list = [];
                const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                for (const [dr, dc] of dirs) {
                    const nr = r + dr;
                    const nc = c + dc;
                    if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
                        if (!isCellLakeInCity(state.activeCity, nr, nc) && state.cityGrid[nr][nc]) {
                            list.push(state.cityGrid[nr][nc]);
                        }
                    }
                }
                return list;
            }

            function evaluatePlacement(r, c, typeId, houseData = null) {
                if (isCellLakeInCity(state.activeCity, r, c)) {
                    return { valid: false, reason: 'ЦЕНТРАЛЬНОЕ ОЗЕРО', pop: 0 };
                }
                if (state.cityGrid[r][c] !== null) {
                    return { valid: false, reason: 'УЧАСТОК ЗАНЯТ', pop: 0 };
                }

                const neighbors = getNeighbors(r, c);
                const hasBlue = neighbors.some(n => n.type === 'blue');
                const hasRed = neighbors.some(n => n.type === 'red');
                const hasGreen = neighbors.some(n => n.type === 'green');

                if (typeId === 'red' && !hasBlue) {
                    return { valid: false, reason: 'НУЖЕН СИНИЙ ДОМ РЯДОМ', pop: 0 };
                }
                if (typeId === 'green' && (!hasBlue || !hasRed)) {
                    return { valid: false, reason: 'НУЖНЫ СИНИЙ И КРАСНЫЙ', pop: 0 };
                }
                if (typeId === 'yellow' && (!hasBlue || !hasRed || !hasGreen)) {
                    return { valid: false, reason: 'НУЖНЫ СИНИЙ, КРАСНЫЙ, ЗЕЛ.', pop: 0 };
                }

                const tier = BUILDING_TYPES[typeId];
                const baseRes = houseData ? houseData.baseResidents : tier.floors * 10;
                const isGolden = houseData ? houseData.isGoldenRoof : false;
                const roofMult = isGolden ? 2.0 : 1.0;

                let neighborBonus = 0;
                for (const n of neighbors) {
                    neighborBonus += n.isGoldenRoof ? 35 : 15;
                }

                const pop = Math.round((baseRes * roofMult + neighborBonus) * tier.multiplier);
                return { valid: true, reason: 'OK', pop };
            }

            function getCityStats(cityIdx = state.activeCity) {
                let totalPop = 0;
                let maxCapacity = 0;
                let goldenCount = 0;
                let buildingCount = 0;
                const grid = state.grids[cityIdx];

                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        const cell = grid[r][c];
                        if (cell) {
                            totalPop += cell.currentPop;
                            maxCapacity += cell.maxPop;
                            buildingCount++;
                            if (cell.isGoldenRoof) goldenCount++;
                        }
                    }
                }
                return { totalPop, maxCapacity, goldenCount, buildingCount };
            }

            function getAllCitiesTotalPop() {
                return getCityStats(0).totalPop + getCityStats(1).totalPop;
            }

            function getNextTargetPop(pop) {
                const targets = [600, 1500, 3500, 7000, 12000, 20000];
                for (const t of targets) {
                    if (pop < t) return t;
                }
                return Math.ceil((pop + 5000) / 5000) * 5000;
            }

            function hasAnyValidTileForType(typeId) {
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (evaluatePlacement(r, c, typeId).valid) return true;
                    }
                }
                return false;
            }

            function getAvailableRelocationTargets(excludeR, excludeC) {
                const list = [];
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (r === excludeR && c === excludeC) continue;
                        const cell = state.cityGrid[r][c];
                        if (cell && cell.maxPop - cell.currentPop > 0) {
                            list.push({ r, c, cell, free: cell.maxPop - cell.currentPop });
                        }
                    }
                }
                return list;
            }

            // =========================================================
            // 6B. MINI-GAMES: AVITO BARGAIN, RELOCATION & COURT
            // =========================================================
            function openAvitoMiniGame(r, c) {
                const cell = state.cityGrid[r][c];
                if (!cell || cell.currentPop >= cell.maxPop) {
                    showBanner('В ЭТОМ ДОМЕ ВСЕ КВАРТИРЫ ПРОДАНЫ', 2.0);
                    return;
                }
                state.avito = {
                    r,
                    c,
                    round: 1,
                    maxRounds: 4,
                    hits: 0,
                    misses: 0,
                    maxMisses: 2,
                    cursorPos: 0.15,
                    cursorDir: 1,
                    cursorSpeed: 1.05,
                    targetCenter: 0.35 + Math.random() * 0.3,
                    targetWidth: 0.24,
                    flashTimer: 0,
                    flashText: '',
                    flashGood: true
                };
                state.citySubMode = 'AVITO';
            }

            function triggerAvitoDealHit() {
                const av = state.avito;
                const cell = state.cityGrid[av.r][av.c];
                if (!cell) {
                    state.citySubMode = 'VIEW';
                    return;
                }

                const dist = Math.abs(av.cursorPos - av.targetCenter);
                const hit = dist <= av.targetWidth / 2;

                if (hit) {
                    av.hits += 1;
                    sfx.perfect(av.hits);
                    av.flashText = `СОВПАДЕНИЕ! (РАУНД ${av.hits})`;
                    av.flashGood = true;
                    av.flashTimer = 0.85;
                    av.round += 1;
                    av.cursorSpeed += 0.28;
                    av.targetWidth = Math.max(0.12, av.targetWidth - 0.03);
                    av.targetCenter = 0.22 + Math.random() * 0.56;
                } else {
                    av.misses += 1;
                    sfx.miss();
                    av.flashText = `НЕ СОШЛИСЬ В ЦЕНЕ (${av.misses}/${av.maxMisses})`;
                    av.flashGood = false;
                    av.flashTimer = 0.85;
                    av.targetCenter = 0.22 + Math.random() * 0.56;
                }

                if (av.misses >= av.maxMisses || av.hits >= av.maxRounds) {
                    finalizeAvitoMiniGame();
                }
            }

            function finalizeAvitoMiniGame() {
                const av = state.avito;
                const cell = state.cityGrid[av.r][av.c];
                state.citySubMode = 'VIEW';
                if (!cell) return;

                if (av.hits <= 0) {
                    showBanner('СДЕЛКА СОРВАЛАСЬ! ПОКУПАТЕЛЬ УШЁЛ', 2.4);
                    return;
                }

                const tier = BUILDING_TYPES[cell.type];
                const free = cell.maxPop - cell.currentPop;
                // За каждое совпадение цены заселяем 3 жильцов со скромной надбавкой (x1.15)
                const soldRes = Math.min(free, av.hits * 3);
                const earned = Math.max(1, Math.round(soldRes * tier.pricePerResident * 1.15));

                cell.currentPop += soldRes;
                state.money += earned;
                saveGrid();

                sfx.cash();
                const pt = getLotCenter(av.r, av.c);
                addParticles(pt.x, pt.y, '#4ADE80', 22, 1.2);
                addPopup(pt.x, pt.y - 24, `+$${earned} (+${soldRes} ЖИТ.)`, '#4ADE80', 1.15);
                showBanner(`АВИТО: ПРОДАНО ${soldRes} МЕСТ ЗА $${earned}!`, 2.6);
            }

            function getDemolishCompensation(cell) {
                const tier = BUILDING_TYPES[cell.type];
                return cell.currentPop * tier.compPerResident;
            }

            function executeDirectCompensation(r, c) {
                const cell = state.cityGrid[r][c];
                if (!cell) return;
                const comp = getDemolishCompensation(cell);

                state.money -= comp;
                state.cityGrid[r][c] = null;
                state.inspectLot = null;
                state.citySubMode = 'VIEW';

                const pt = getLotCenter(r, c);
                sfx.miss();
                addParticles(pt.x, pt.y, '#94A3B8', 20, 1.1);
                if (comp > 0) {
                    addPopup(pt.x, pt.y - 22, `-$${comp} КОМПЕНСАЦИЯ`, '#F87171', 1.1);
                }

                if (!checkBankruptcy()) {
                    saveGrid();
                    showBanner(comp > 0 ? `СНЕСЕНО. ВЫПЛАЧЕНО $${comp}` : 'ПУСТОЙ ДОМ СНЕСЁН', 2.2);
                }
            }

            function startRelocationProcess(srcR, srcC, dstR, dstC) {
                const src = state.cityGrid[srcR][srcC];
                const dst = state.cityGrid[dstR][dstC];
                if (!src || !dst) return;

                const freeSpace = dst.maxPop - dst.currentPop;
                const movablePool = Math.min(src.currentPop, freeSpace);
                const leftBehind = src.currentPop - movablePool;

                const srcTier = BUILDING_TYPES[src.type];
                const dstTier = BUILDING_TYPES[dst.type];
                const isBetter = dstTier.tierRank > srcTier.tierRank || (dst.isGoldenRoof && !src.isGoldenRoof);

                // Если новый дом лучше — соглашается ~75% жильцов и доплачивают за улучшение;
                // Если такой же или хуже — соглашается ~45%, остальные отказываются!
                const agreeRatio = isBetter ? (0.65 + Math.random() * 0.25) : (0.35 + Math.random() * 0.25);
                const agreed = Math.min(movablePool, Math.max(1, Math.round(movablePool * agreeRatio)));
                const refused = (movablePool - agreed) + leftBehind;

                const upcharge = isBetter ? agreed * (dstTier.tierRank - srcTier.tierRank + 1) * 3 : 0;
                const refusedComp = refused * srcTier.compPerResident;

                // Заселяем согласившихся в новый дом и сносим старый
                dst.currentPop += agreed;
                state.money += upcharge;
                state.cityGrid[srcR][srcC] = null;
                state.inspectLot = null;
                saveGrid();

                sfx.cash();
                const ptDst = getLotCenter(dstR, dstC);
                addParticles(ptDst.x, ptDst.y, '#38BDF8', 18, 1.1);
                if (upcharge > 0) {
                    addPopup(ptDst.x, ptDst.y - 24, `+$${upcharge} ДОПЛАТА`, '#4ADE80', 1.12);
                }

                state.reloc = {
                    srcR,
                    srcC,
                    dstR,
                    dstC,
                    agreedCount: agreed,
                    refusedCount: refused,
                    upchargeEarned: upcharge,
                    refusedCompCost: refusedComp
                };

                if (refused <= 0) {
                    state.citySubMode = 'VIEW';
                    showBanner(`ВСЕ ${agreed} ЖИЛЬЦОВ ПЕРЕСЕЛЕНЫ!`, 2.4);
                } else {
                    state.citySubMode = 'RELOCATE_RESULT';
                }
            }

            function startCourtMiniGame(debtAmount) {
                const shuffledTargets = [0.22 + Math.random() * 0.14, 0.64 + Math.random() * 0.16, 0.42 + Math.random() * 0.16];
                state.court = {
                    baseDebt: debtAmount,
                    stage: 1,
                    stageTitle: 'ЭТАП 1/3: ВСТРЕЧНЫЙ ИСК',
                    // Этап 1 (замедленный темп для комфортного попадания)
                    markerPos: 0.08,
                    markerDir: 1,
                    markerSpeed: 1.45,
                    zoneCenter: 0.5,
                    zoneDir: Math.random() > 0.5 ? 1 : -1,
                    zoneSpeed: 0.30,
                    zoneWidth: 0.15,
                    // Этап 2 (замедленный темп аргументов)
                    s2Step: 0,
                    s2Pos: 0.05,
                    s2Dir: 1,
                    s2Speed: 1.65,
                    s2Targets: shuffledTargets,
                    s2Tol: 0.082,
                    // Этап 3 (больше времени и плавнее движение встречных бегунков)
                    s3TimeLeft: 6.2,
                    s3MaxTime: 6.2,
                    s3TopPos: 0.06,
                    s3TopDir: 1,
                    s3TopSpeed: 1.55,
                    s3BotPos: 0.94,
                    s3BotDir: -1,
                    s3BotSpeed: 1.95,
                    s3Center: 0.44 + Math.random() * 0.12,
                    s3HalfWidth: 0.10,
                    // Состояние
                    flashTimer: 0,
                    flashText: '',
                    flashGood: true,
                    finished: false,
                    won: false,
                    resultTimer: 0
                };
                state.citySubMode = 'COURT';
            }

            function failCourtImmediately(reasonText) {
                const ct = state.court;
                ct.finished = true;
                ct.won = false;
                ct.flashText = reasonText;
                ct.flashGood = false;
                ct.flashTimer = 1.6;
                ct.resultTimer = 1.65;
                sfx.miss();
            }

            function hitCourtVerdict() {
                const ct = state.court;
                if (ct.finished) return;

                if (ct.stage === 1) {
                    // Этап 1: Попасть быстрым бегунком в движущуюся зелёную зону
                    const dist = Math.abs(ct.markerPos - ct.zoneCenter);
                    if (dist <= ct.zoneWidth / 2) {
                        sfx.perfect(1);
                        ct.stage = 2;
                        ct.stageTitle = 'ЭТАП 2/3: ПЕРЕКРЁСТНЫЙ ДОПРОС';
                        ct.s2Step = 0;
                        ct.s2Pos = 0.04;
                        ct.s2Dir = 1;
                        ct.flashText = 'ХОДАТАЙСТВО ПРИНЯТО! ПЕРЕХОДИМ К ДОПРОСУ';
                        ct.flashGood = true;
                        ct.flashTimer = 1.0;
                    } else {
                        failCourtImmediately('СУДЬЯ ОТКЛОНИЛ ХОДАТАЙСТВО!');
                    }
                } else if (ct.stage === 2) {
                    // Этап 2: Закрыть 3 аргумента подряд без единого промаха
                    const target = ct.s2Targets[ct.s2Step];
                    const dist = Math.abs(ct.s2Pos - target);
                    if (dist <= ct.s2Tol) {
                        ct.s2Step += 1;
                        sfx.perfect(ct.s2Step + 1);
                        if (ct.s2Step >= 3) {
                            ct.stage = 3;
                            ct.stageTitle = 'ЭТАП 3/3: ПРИГОВОР СУДЬИ';
                            ct.s3TimeLeft = ct.s3MaxTime;
                            ct.flashText = 'СВИДЕТЕЛИ РАЗБИТЫ! ФИНАЛЬНЫЙ ВЕРДИКТ!';
                            ct.flashGood = true;
                            ct.flashTimer = 1.0;
                        } else {
                            ct.s2Speed += 0.28;
                            ct.s2Tol = Math.max(0.062, ct.s2Tol - 0.006);
                            ct.flashText = `АРГУМЕНТ ${ct.s2Step}/3 ПРИНЯТ!`;
                            ct.flashGood = true;
                            ct.flashTimer = 0.7;
                        }
                    } else {
                        failCourtImmediately(`ПРОТИВОРЕЧИЕ В ПОКАЗАНИЯХ (${ct.s2Step + 1}/3)!`);
                    }
                } else if (ct.stage === 3) {
                    // Этап 3: Оба встречных бегунка должны одновременно оказаться в центральной зоне печати
                    const topOk = Math.abs(ct.s3TopPos - ct.s3Center) <= ct.s3HalfWidth;
                    const botOk = Math.abs(ct.s3BotPos - ct.s3Center) <= ct.s3HalfWidth;
                    if (topOk && botOk) {
                        ct.finished = true;
                        ct.won = true;
                        ct.flashText = 'ПОЛНАЯ ПОБЕДА В СУДЕ!';
                        ct.flashGood = true;
                        ct.flashTimer = 1.6;
                        ct.resultTimer = 1.65;
                        sfx.goldenRoof();
                    } else {
                        failCourtImmediately('НЕСИНХРОННАЯ ПОДАЧА ДОКУМЕНТОВ!');
                    }
                }
            }

            function finishTowerBuild() {
                const b = state.build;
                state.pendingHouse = {
                    type: b.tier.id,
                    floors: b.tier.floors,
                    baseResidents: b.residents,
                    isGoldenRoof: b.isGoldenRoof
                };

                state.mode = 'CITY';

                if (state.selectedLot) {
                    const { r, c } = state.selectedLot;
                    state.selectedLot = null;
                    const check = evaluatePlacement(r, c, state.pendingHouse.type, state.pendingHouse);
                    if (check.valid) {
                        state.citySubMode = 'VIEW';
                        placePendingHouse(r, c);
                        return;
                    }
                }

                state.citySubMode = 'PLACING';
                showBanner(
                    b.isGoldenRoof
                        ? 'ЗОЛОТАЯ КРЫША! ВЫБЕРИ УЧАСТОК (x2 МЕСТ)'
                        : 'ВЫБЕРИ ЗЕЛЁНЫЙ УЧАСТОК НА КАРТЕ',
                    3.0
                );
            }

            function placePendingHouse(r, c) {
                if (!state.pendingHouse) return;
                const check = evaluatePlacement(r, c, state.pendingHouse.type, state.pendingHouse);
                if (!check.valid) {
                    sfx.miss();
                    showBanner(check.reason, 2.0);
                    return;
                }

                sfx.cityPlace(state.pendingHouse.isGoldenRoof);
                // Новый построенный дом появляется ПУСТЫМ (currentPop: 0) — жильцы заселяются сами или через Авито!
                state.cityGrid[r][c] = {
                    type: state.pendingHouse.type,
                    floors: state.pendingHouse.floors,
                    isGoldenRoof: state.pendingHouse.isGoldenRoof,
                    baseResidents: state.pendingHouse.baseResidents,
                    maxPop: check.pop,
                    currentPop: 0,
                    dropAnim: 1.0
                };

                const wasGolden = state.pendingHouse.isGoldenRoof;
                state.pendingHouse = null;
                state.citySubMode = 'VIEW';
                saveGrid();

                const pt = getLotCenter(r, c);
                addParticles(pt.x, pt.y, wasGolden ? '#FFD700' : '#FFFFFF', 26, 1.3);
                addPopup(pt.x, pt.y - 26, `ПОСТРОЕНО! 0/${check.pop} ЖИТ.`, wasGolden ? '#FFD700' : '#FFF176', 1.12);
                showBanner('ДОМ ПОСТРОЕН! НАЖМИ НА ДОМ ДЛЯ ПРОДАЖИ НА АВИТО', 3.0);
            }

            // =========================================================
            // 8. CITY GRID GEOMETRY
            // =========================================================
            function getCityGeometry() {
                const topBarH = 68;
                const bottomBarH = 68;
                const availW = W - 20;
                const availH = H - topBarH - bottomBarH;
                const boardSize = Math.max(250, Math.min(availW, availH, 460));
                const roadW = Math.max(11, Math.round(boardSize * 0.038));
                const lotSize = (boardSize - roadW * (GRID_SIZE + 1)) / GRID_SIZE;
                const startX = Math.round((W - boardSize) / 2);
                const startY = Math.round(topBarH + (availH - boardSize) / 2);
                return { boardSize, roadW, lotSize, startX, startY };
            }

            function getLotRect(r, c) {
                const { roadW, lotSize, startX, startY } = getCityGeometry();
                return {
                    x: startX + roadW + c * (lotSize + roadW),
                    y: startY + roadW + r * (lotSize + roadW),
                    w: lotSize,
                    h: lotSize
                };
            }

            function getLotCenter(r, c) {
                const rect = getLotRect(r, c);
                return { x: rect.x + rect.w / 2, y: rect.y + rect.h / 2 };
            }

            // =========================================================
            // 9. CLASSIC 2005 J2ME CANVAS UI PRIMITIVES
            // =========================================================
            function registerHitbox(id, x, y, w, h, onClick) {
                state.hitboxes.push({ id, x, y, w, h, onClick });
            }

            function drawArcadeBox(x, y, w, h, fillTop, fillBot, borderCol = '#111827', innerBorder = '#FFF59D') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
                ctx.fillRect(x + 4, y + 4, w, h);

                const g = ctx.createLinearGradient(0, y, 0, y + h);
                g.addColorStop(0, fillTop);
                g.addColorStop(1, fillBot);
                ctx.fillStyle = g;
                ctx.fillRect(x, y, w, h);

                ctx.strokeStyle = borderCol;
                ctx.lineWidth = 3;
                ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);

                if (innerBorder) {
                    ctx.strokeStyle = innerBorder;
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(x + 3.5, y + 3.5, w - 7, h - 7);
                }
            }

            function drawArcadeButton(id, x, y, w, h, label, scheme = 'gold', onClick, fontSize = 16) {
                const palettes = {
                    gold: ['#FFE066', '#F59E0B', '#111827', '#FFFBEB'],
                    blue: ['#38BDF8', '#0284C7', '#FFFFFF', '#BAE6FD'],
                    red: ['#F87171', '#DC2626', '#FFFFFF', '#FECACA'],
                    dark: ['#334155', '#0F172A', '#FACC15', '#64748B'],
                    green: ['#4ADE80', '#16A34A', '#111827', '#DCFCE7']
                };
                const [c1, c2, txtCol, hiCol] = palettes[scheme] || palettes.gold;

                drawArcadeBox(x, y, w, h, c1, c2, '#111827', hiCol);

                ctx.font = `900 ${fontSize}px 'Arial Black', Impact, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                if (txtCol === '#FFFFFF') {
                    ctx.fillStyle = '#111827';
                    ctx.fillText(label, x + w / 2 + 1.5, y + h / 2 + 2);
                }
                ctx.fillStyle = txtCol;
                ctx.fillText(label, x + w / 2, y + h / 2 + 0.5);

                if (onClick) {
                    registerHitbox(id, x, y, w, h, () => {
                        sfx.click();
                        onClick();
                    });
                }
            }

            function drawMiniHouseIcon(cx, cy, tier, isGolden = false, scale = 1) {

                ctx.fillStyle = tier.windowLit;
                ctx.fillRect(-8, -2, 5, 5);
                ctx.fillRect(3, -2, 5, 5);
                ctx.fillRect(-8, 6, 5, 5);
                ctx.fillRect(3, 6, 5, 5);

                ctx.restore();
            }

            function drawLockIcon(cx, cy) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.strokeStyle = '#111827';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, -4, 5, Math.PI, 0);
                ctx.stroke();

                ctx.fillStyle = '#94A3B8';
                ctx.fillRect(-7, -3, 14, 11);
                ctx.strokeRect(-7, -3, 14, 11);
                ctx.restore();
            }

            // =========================================================
            // 10. UPDATE SIMULATION (INCLUDING ORGANIC MOVE-INS & MINI-GAMES)
            // =========================================================
            function update(dt) {
                state.animClock += dt;

                if (state.toastTimer > 0) {
                    state.toastTimer = Math.max(0, state.toastTimer - dt);
                }

                // Самостоятельное заселение: строго каждые 2 минуты (120 сек) заселяется 1 житель в 1 случайный свободный дом
                if (state.mode === 'CITY' && state.citySubMode !== 'BANKRUPT' && state.citySubMode !== 'AD_WATCH') {
                    state.autoMoveTimer += dt;
                    if (state.autoMoveTimer >= 120) {
                        state.autoMoveTimer = 0;
                        const vacant = [];
                        for (let r = 0; r < GRID_SIZE; r++) {
                            for (let c = 0; c < GRID_SIZE; c++) {
                                const cell = state.cityGrid[r][c];
                                if (cell && cell.currentPop < cell.maxPop) {
                                    vacant.push({ r, c, cell });
                                }
                            }
                        }
                        if (vacant.length > 0) {
                            const pick = vacant[Math.floor(Math.random() * vacant.length)];
                            const tier = BUILDING_TYPES[pick.cell.type];
                            pick.cell.currentPop += 1;
                            state.money += tier.pricePerResident;
                            saveGrid();
                            const pt = getLotCenter(pick.r, pick.c);
                            addPopup(pt.x, pt.y - 16, `+$${tier.pricePerResident} (+1 ЖИТ.)`, '#4ADE80', 0.95);
                        }
                    }
                }

                // Анимация мини-игры Авито-торг
                if (state.mode === 'CITY' && state.citySubMode === 'AVITO') {
                    const av = state.avito;
                    if (av.flashTimer > 0) {
                        av.flashTimer = Math.max(0, av.flashTimer - dt);
                    }
                    av.cursorPos += av.cursorDir * av.cursorSpeed * dt;
                    if (av.cursorPos >= 1) {
                        av.cursorPos = 1;
                        av.cursorDir = -1;
                    } else if (av.cursorPos <= 0) {
                        av.cursorPos = 0;
                        av.cursorDir = 1;
                    }
                }

                // Анимация антикризисного ролика при банкротстве
                if (state.mode === 'CITY' && state.citySubMode === 'AD_WATCH') {
                    const ad = state.adWatch;
                    ad.timer += dt;
                    if (ad.timer >= ad.duration) {
                        const relief = Math.max(150, Math.round(ad.debtAmount * 0.5));
                        state.money = relief;
                        state.citySubMode = 'VIEW';
                        saveGrid();
                        sfx.cash();
                        showBanner(`ДОЛГ СПИСАН! ПОЛУЧЕНО $${relief}`, 2.6);
                    }
                }

                // Анимация мини-игры Суд (3 сложных этапа)
                if (state.mode === 'CITY' && state.citySubMode === 'COURT') {
                    const ct = state.court;
                    if (ct.flashTimer > 0) {
                        ct.flashTimer = Math.max(0, ct.flashTimer - dt);
                    }

                    if (!ct.finished) {
                        if (ct.stage === 1) {
                            ct.markerPos += ct.markerDir * ct.markerSpeed * dt;
                            if (ct.markerPos >= 1) {
                                ct.markerPos = 1;
                                ct.markerDir = -1;
                            } else if (ct.markerPos <= 0) {
                                ct.markerPos = 0;
                                ct.markerDir = 1;
                            }

                            const minZ = ct.zoneWidth / 2 + 0.04;
                            const maxZ = 1 - ct.zoneWidth / 2 - 0.04;
                            ct.zoneCenter += ct.zoneDir * ct.zoneSpeed * dt;
                            if (ct.zoneCenter >= maxZ) {
                                ct.zoneCenter = maxZ;
                                ct.zoneDir = -1;
                            } else if (ct.zoneCenter <= minZ) {
                                ct.zoneCenter = minZ;
                                ct.zoneDir = 1;
                            }
                        } else if (ct.stage === 2) {
                            ct.s2Pos += ct.s2Dir * ct.s2Speed * dt;
                            if (ct.s2Pos >= 1) {
                                ct.s2Pos = 1;
                                ct.s2Dir = -1;
                            } else if (ct.s2Pos <= 0) {
                                ct.s2Pos = 0;
                                ct.s2Dir = 1;
                            }
                        } else if (ct.stage === 3) {
                            ct.s3TimeLeft = Math.max(0, ct.s3TimeLeft - dt);
                            if (ct.s3TimeLeft <= 0) {
                                failCourtImmediately('ВРЕМЯ ЗАСЕДАНИЯ ИСТЕКЛО!');
                            } else {
                                ct.s3TopPos += ct.s3TopDir * ct.s3TopSpeed * dt;
                                if (ct.s3TopPos >= 1) {
                                    ct.s3TopPos = 1;
                                    ct.s3TopDir = -1;
                                } else if (ct.s3TopPos <= 0) {
                                    ct.s3TopPos = 0;
                                    ct.s3TopDir = 1;
                                }

                                ct.s3BotPos += ct.s3BotDir * ct.s3BotSpeed * dt;
                                if (ct.s3BotPos >= 1) {
                                    ct.s3BotPos = 1;
                                    ct.s3BotDir = -1;
                                } else if (ct.s3BotPos <= 0) {
                                    ct.s3BotPos = 0;
                                    ct.s3BotDir = 1;
                                }
                            }
                        }
                    } else {
                        ct.resultTimer -= dt;
                        if (ct.resultTimer <= 0) {
                            if (ct.won) {
                                state.citySubMode = 'VIEW';
                                showBanner('СУД ВЫИГРАН! КОМПЕНСАЦИЯ $0', 2.5);
                            } else {
                                const penaltyDebt = Math.round(ct.baseDebt * 1.25);
                                state.money -= penaltyDebt;
                                state.citySubMode = 'VIEW';
                                addPopup(W / 2, H * 0.45, `-$${penaltyDebt} (ШТРАФ +25%)`, '#EF4444', 1.15);
                                if (!checkBankruptcy()) {
                                    saveGrid();
                                    showBanner(`СУД ПРОИГРАН! ВЫПЛАЧЕНО $${penaltyDebt}`, 2.6);
                                }
                            }
                        }
                    }
                }

                // Анимация постройки домов на карте города
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        const cell = state.cityGrid[r][c];
                        if (cell && cell.dropAnim > 0) {
                            cell.dropAnim = Math.max(0, cell.dropAnim - dt * 3.2);
                        }
                    }
                }

                // Анимация фонового транспорта, облаков и птиц
                for (const c of state.clouds) {
                    c.x += c.speed * dt;
                    if (c.x > 1.25) c.x = -0.25;
                    if (c.x < -0.25) c.x = 1.25;
                }
                state.blimp.x += state.blimp.speed * dt;
                if (state.blimp.x > 1.2) state.blimp.x = -0.2;

                for (const bird of state.birds) {
                    bird.x += bird.speed * dt;
                    bird.flap += dt * 11;
                    if (bird.x > 1.1) bird.x = -0.1;
                    if (bird.x < -0.1) bird.x = 1.1;
                }

                for (const sc of state.streetCars) {
                    sc.x += sc.speed * dt;
                    if (sc.x > 1.15) sc.x = -0.15;
                    if (sc.x < -0.15) sc.x = 1.15;
                }

                for (const car of state.cars) {
                    car.t += car.v * dt;
                    if (car.t > 1.05) car.t = -0.05;
                    if (car.t < -0.05) car.t = 1.05;
                }

                for (const ped of state.pedestrians) {
                    ped.t += ped.v * dt;
                    if (ped.t > 1.02) ped.t = -0.02;
                    if (ped.t < -0.02) ped.t = 1.02;
                }

                // Физика режима строительства башни (BUILD)
                if (state.mode === 'BUILD') {
                    updateBuildMode(dt);
                }

                // Обновление частиц и всплывающих надписей
                for (let i = state.particles.length - 1; i >= 0; i--) {
                    const p = state.particles[i];
                    p.vy += 360 * dt;
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.life -= dt;
                    if (p.life <= 0) state.particles.splice(i, 1);
                }

                for (let i = state.popups.length - 1; i >= 0; i--) {
                    const f = state.popups[i];
                    f.y += f.vy * dt;
                    f.life -= dt;
                    if (f.life <= 0) state.popups.splice(i, 1);
                }
            }

            function addParticles(x, y, color, count = 14, speedScale = 1) {
                for (let i = 0; i < count; i++) {
                    const ang = Math.random() * Math.PI * 2;
                    const spd = (55 + Math.random() * 135) * speedScale;
                    state.particles.push({
                        x,
                        y,
                        vx: Math.cos(ang) * spd,
                        vy: Math.sin(ang) * spd - 65,
                        size: 4 + Math.random() * 4,
                        color,
                        life: 0.45 + Math.random() * 0.35,
                        maxLife: 0.8
                    });
                }
            }

            function addPopup(x, y, text, color = '#FACC15', scale = 1.0) {
                state.popups.push({
                    x,
                    y,
                    text,
                    color,
                    scale,
                    vy: -44,
                    life: 1.15
                });
            }

            function startBuild(typeId, isQuickPlay = false) {
                const tier = BUILDING_TYPES[typeId] || BUILDING_TYPES.blue;
                if (!isQuickPlay) {
                    if (state.money < tier.buildCost) {
                        sfx.miss();
                        showBanner(`НЕ ХВАТАЕТ ДЕНЕГ ($${tier.buildCost})`, 2.0);
                        return;
                    }
                    state.money -= tier.buildCost;
                    saveGrid();
                }

                const b = state.build;
                const groundY = H - 84;
                const blockH = 44;
                const baseW = Math.min(118, Math.round(W * 0.28));

                b.tier = tier;
                b.isQuickPlay = isQuickPlay;
                b.residents = 10;
                b.score = 100;
                b.lives = 3;
                b.combo = 0;
                b.flawless = true;
                b.baseBlockW = baseW;
                b.isGoldenRoof = false;
                b.roofPhase = false;
                b.failed = false;
                b.completeTimer = 0;
                b.cameraY = 0;
                b.targetCameraY = 0;
                b.shakeTime = 0;
                b.shakeMag = 0;
                b.fallingBlocks = [];
                b.debrisChunks = [];
                b.parachutists = [];

                b.crane.angle = 0;
                b.crane.time = 0;
                b.crane.speed = 2.25 + tier.tierRank * 0.16;

                b.blocks = [{
                    x: W / 2,
                    y: groundY - blockH / 2 - 6,
                    w: baseW,
                    h: blockH,
                    tier,
                    isBase: true,
                    isRoof: false,
                    squash: 0,
                    glow: 0,
                    litWindows: [true, true, true, true]
                }];

                state.mode = 'BUILD';
                spawnNextBlock();
            }

            function spawnNextBlock() {
                const b = state.build;
                const top = b.blocks[b.blocks.length - 1];
                const isRoof = !b.isQuickPlay && b.blocks.length >= b.tier.floors;
                b.roofPhase = isRoof;

                const blockH = isRoof ? 40 : 44;
                const litWindows = Array.from({ length: 6 }, () => Math.random() > 0.35);

                b.activeBlock = {
                    x: W / 2,
                    y: -b.cameraY + 66 + b.crane.ropeLen + blockH / 2,
                    w: top.w,
                    h: blockH,
                    tier: b.tier,
                    isBase: false,
                    isRoof,
                    isGolden: false,
                    state: 'SWINGING',
                    vy: 0,
                    vx: 0,
                    angle: 0,
                    squash: 0,
                    glow: 0,
                    litWindows
                };
            }

            function dropBlock() {
                const b = state.build;
                if (b.failed || b.completeTimer > 0) return;
                if (!b.activeBlock || b.activeBlock.state !== 'SWINGING') return;

                b.activeBlock.state = 'DROPPING';
                b.activeBlock.vy = 220;
                sfx.drop();
            }

            function spawnParachutists(x, y, count) {
                const b = state.build;
                const canopies = ['#EF4444', '#38BDF8', '#FACC15', '#4ADE80'];
                const shirts = ['#FFFFFF', '#1E3A8A', '#F97316'];
                for (let i = 0; i < count; i++) {
                    b.parachutists.push({
                        x: x + (Math.random() - 0.5) * 44,
                        y: y - 16 - i * 14,
                        vx: (Math.random() - 0.5) * 28,
                        vy: 42 + Math.random() * 18,
                        phase: Math.random() * Math.PI * 2,
                        canopy: canopies[i % canopies.length],
                        shirt: shirts[i % shirts.length]
                    });
                }
            }

            function updateBuildMode(dt) {
                const b = state.build;

                if (b.shakeTime > 0) {
                    b.shakeTime = Math.max(0, b.shakeTime - dt);
                }

                for (const blk of b.blocks) {
                    if (blk.squash > 0) blk.squash = Math.max(0, blk.squash - dt * 5);
                    if (blk.glow > 0) blk.glow = Math.max(0, blk.glow - dt * 1.8);
                }

                // Плавное поднятие камеры за высотой башни
                const top = b.blocks[b.blocks.length - 1];
                const desiredScreenTop = H * 0.62;
                b.targetCameraY = Math.max(0, desiredScreenTop - top.y);
                b.cameraY += (b.targetCameraY - b.cameraY) * Math.min(1, dt * 6);

                if (b.completeTimer > 0) {
                    b.completeTimer -= dt;
                    if (b.completeTimer <= 0) {
                        finishTowerBuild();
                    }
                }

                // Движение крана и активного блока
                if (b.activeBlock && !b.failed && b.completeTimer <= 0) {
                    const ab = b.activeBlock;
                    if (ab.state === 'SWINGING') {
                        b.crane.time += dt * b.crane.speed;
                        b.crane.angle = Math.sin(b.crane.time) * b.crane.maxAngle;
                        const swingRange = Math.min(W * 0.34, 155);
                        ab.x = W / 2 + b.crane.angle * swingRange;
                        ab.y = -b.cameraY + 66 + b.crane.ropeLen + ab.h / 2;
                        ab.angle = Math.cos(b.crane.time) * 0.045;
                    } else if (ab.state === 'DROPPING') {
                        ab.vy += 1450 * dt;
                        ab.y += ab.vy * dt;
                        ab.angle *= 0.85;

                        const targetY = top.y - top.h / 2 - ab.h / 2;
                        if (ab.y >= targetY) {
                            ab.y = targetY;
                            ab.angle = 0;
                            resolveBlockLanding(ab, top);
                        }
                    }
                }

                // Падающие мимо башни блоки
                for (let i = b.fallingBlocks.length - 1; i >= 0; i--) {
                    const fb = b.fallingBlocks[i];
                    fb.vy += 1200 * dt;
                    fb.x += fb.vx * dt;
                    fb.y += fb.vy * dt;
                    fb.angle += fb.vAngle * dt;
                    if (fb.y > -b.cameraY + H + 120) {
                        b.fallingBlocks.splice(i, 1);
                    }
                }

                // Обломки от сколов краёв этажа
                for (let i = b.debrisChunks.length - 1; i >= 0; i--) {
                    const dc = b.debrisChunks[i];
                    dc.vy += 1100 * dt;
                    dc.x += dc.vx * dt;
                    dc.y += dc.vy * dt;
                    dc.angle += dc.vAngle * dt;
                    if (dc.y > -b.cameraY + H + 120) {
                        b.debrisChunks.splice(i, 1);
                    }
                }

                // Парашютисты-новосёлы
                for (let i = b.parachutists.length - 1; i >= 0; i--) {
                    const p = b.parachutists[i];
                    p.phase += dt * 4;
                    p.x += (p.vx + Math.sin(p.phase) * 18) * dt;
                    p.y += p.vy * dt;
                    if (p.y >= top.y - top.h / 2) {
                        sfx.chuteLand();
                        b.parachutists.splice(i, 1);
                    }
                }
            }

            function resolveBlockLanding(ab, top) {
                const b = state.build;
                const diff = ab.x - top.x;
                const absDiff = Math.abs(diff);
                const maxReach = (top.w + ab.w) * 0.48;

                // Полный промах мимо башни
                if (absDiff > maxReach) {
                    b.fallingBlocks.push({
                        ...ab,
                        vx: diff >= 0 ? 110 : -110,
                        vy: 140,
                        vAngle: diff >= 0 ? 2.6 : -2.6
                    });
                    b.activeBlock = null;
                    b.combo = 0;
                    b.flawless = false;
                    b.lives -= 1;
                    b.shakeTime = 0.25;
                    b.shakeMag = 7;
                    sfx.miss();
                    addPopup(ab.x, ab.y - 16, 'МИМО!', '#F87171', 1.15);

                    if (b.lives <= 0) {
                        b.failed = true;
                    } else {
                        spawnNextBlock();
                    }
                    return;
                }

                const centerTol = Math.max(9, Math.min(top.w, ab.w) * 0.11);
                const isPerfect = absDiff <= centerTol;

                // Обработка установки финальной крыши
                if (ab.isRoof) {
                    ab.x = isPerfect ? top.x : top.x + diff * 0.5;
                    ab.squash = 0.75;
                    ab.isGolden = isPerfect && b.flawless;
                    ab.glow = ab.isGolden ? 1.0 : 0.4;
                    b.isGoldenRoof = ab.isGolden;
                    b.blocks.push(ab);
                    b.activeBlock = null;
                    b.completeTimer = 1.25;

                    if (ab.isGolden) {
                        sfx.goldenRoof();
                        addParticles(ab.x, ab.y, '#FFD700', 30, 1.35);
                        addPopup(ab.x, ab.y - 30, 'ЗОЛОТАЯ КРЫША x2!', '#FFD700', 1.25);
                    } else {
                        sfx.standardRoof();
                        addParticles(ab.x, ab.y, '#FFFFFF', 18, 1.0);
                        addPopup(ab.x, ab.y - 26, 'ДОМ ЗАВЕРШЁН!', '#4ADE80', 1.15);
                    }
                    return;
                }

                // Обычный этаж: идеальное попадание или срез выступающего края
                if (isPerfect) {
                    ab.x = top.x;
                    ab.squash = 0.8;
                    ab.glow = 0.9;
                    b.combo += 1;
                    const gained = 10 + Math.min(b.combo * 2, 12);
                    b.residents += gained;
                    b.score += gained * 15;
                    b.blocks.push(ab);
                    b.activeBlock = null;

                    sfx.perfect(b.combo);
                    addParticles(ab.x, ab.y + ab.h / 2, '#FFD700', 16, 1.1);
                    addPopup(ab.x, ab.y - 22, `ИДЕАЛЬНО! +${gained}`, '#FFD700', 1.1);
                    spawnParachutists(ab.x, ab.y - 40, Math.min(3, 1 + Math.floor(b.combo / 2)));
                } else {
                    const overlap = (top.w + ab.w) / 2 - absDiff;
                    const newW = Math.max(26, overlap);
                    const overhang = ab.w - newW;

                    if (overhang > 4) {
                        const sideSign = diff > 0 ? 1 : -1;
                        b.debrisChunks.push({
                            x: ab.x + sideSign * (newW / 2 + overhang / 2),
                            y: ab.y,
                            w: overhang,
                            h: ab.h,
                            color: b.tier.wall,
                            trimColor: b.tier.trim,
                            vx: sideSign * 95,
                            vy: -40,
                            angle: 0,
                            vAngle: sideSign * 3.2
                        });
                        sfx.crumble();
                    } else {
                        sfx.land();
                    }

                    ab.w = newW;
                    ab.x = top.x + diff * 0.5;
                    ab.squash = 0.55;
                    b.combo = 0;
                    b.flawless = false;
                    const gained = Math.max(5, Math.round((newW / b.baseBlockW) * 10));
                    b.residents += gained;
                    b.score += gained * 10;
                    b.blocks.push(ab);
                    b.activeBlock = null;

                    b.shakeTime = 0.12;
                    b.shakeMag = 3.5;
                    addPopup(ab.x, ab.y - 20, `+${gained} ЖИТ.`, '#FFFFFF', 1.0);
                    spawnParachutists(ab.x, ab.y - 36, 1);
                }

                if (b.isQuickPlay) {
                    b.crane.speed = Math.min(4.4, b.crane.speed + 0.045);
                }
                spawnNextBlock();
            }

            // =========================================================
            // 11. RENDERING: PARALLAX SCENERY, SKYLINE & LAKES
            // =========================================================
            function drawSunWithRays(sx, sy, radius, alpha = 1) {
                if (alpha <= 0.01) return;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(sx, sy);

                const halo = ctx.createRadialGradient(0, 0, radius * 0.5, 0, 0, radius * 2.8);
                halo.addColorStop(0, 'rgba(254, 240, 138, 0.55)');
                halo.addColorStop(0.5, 'rgba(250, 204, 21, 0.18)');
                halo.addColorStop(1, 'rgba(250, 204, 21, 0)');
                ctx.fillStyle = halo;
                ctx.beginPath();
                ctx.arc(0, 0, radius * 2.8, 0, Math.PI * 2);
                ctx.fill();

                ctx.save();
                ctx.rotate(state.animClock * 0.22);
                ctx.fillStyle = 'rgba(254, 240, 138, 0.35)';
                const rayCount = 12;
                for (let i = 0; i < rayCount; i++) {
                    const a = (Math.PI * 2 * i) / rayCount;
                    ctx.save();
                    ctx.rotate(a);
                    ctx.beginPath();
                    ctx.moveTo(-4, -radius - 4);
                    ctx.lineTo(0, -radius - 18);
                    ctx.lineTo(4, -radius - 4);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }
                ctx.restore();

                ctx.fillStyle = '#FACC15';
                ctx.strokeStyle = '#111827';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#FEF9C3';
                ctx.beginPath();
                ctx.arc(-radius * 0.25, -radius * 0.25, radius * 0.42, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            function drawCloud2005(cx, cy, s) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.scale(s, s);

                ctx.fillStyle = '#1E3A8A';
                ctx.beginPath();
                ctx.arc(0, 2, 24, 0, Math.PI * 2);
                ctx.arc(22, 0, 28, 0, Math.PI * 2);
                ctx.arc(46, 3, 20, 0, Math.PI * 2);
                ctx.arc(-20, 5, 18, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#93C5FD';
                ctx.beginPath();
                ctx.arc(0, 3, 21, 0, Math.PI * 2);
                ctx.arc(22, 1, 25, 0, Math.PI * 2);
                ctx.arc(46, 4, 17, 0, Math.PI * 2);
                ctx.arc(-20, 6, 15, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.arc(0, -1, 20, 0, Math.PI * 2);
                ctx.arc(22, -3, 24, 0, Math.PI * 2);
