            function drawCitySkylineLayer(groundY, parallaxOffset = 0, clearCenterZone = false) {
                ctx.save();
                ctx.translate(0, parallaxOffset);

                drawDistantHills2005(groundY);

                const centerLeft = W * 0.26;
                const centerRight = W * 0.74;

                for (const b of state.skylineBack) {
                    const bx = Math.round(b.x * W);
                    const bw = Math.max(26, Math.round(b.w * W));
                    if (clearCenterZone && bx + bw > centerLeft && bx < centerRight) {
                        continue;
                    }
                    const by = groundY - b.h;
                    const sideW = Math.max(6, Math.round(bw * 0.22));

                    ctx.fillStyle = b.c;
                    ctx.fillRect(bx, by, bw - sideW, b.h);
                    ctx.fillStyle = b.side;
                    ctx.fillRect(bx + bw - sideW, by, sideW, b.h);

                    ctx.strokeStyle = '#0F172A';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(bx, by, bw, b.h);

                    if (b.spire) {
                        const sx = bx + (bw - sideW) / 2;
                        ctx.fillStyle = '#94A3B8';
                        ctx.fillRect(sx - 1.5, by - 22, 3, 22);
                        const blink = Math.sin(state.animClock * 4 + b.litSeed) > 0;
                        ctx.fillStyle = blink ? '#EF4444' : '#7F1D1D';
                        ctx.beginPath();
                        ctx.arc(sx, by - 24, 2.8, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    const cols = Math.max(2, Math.floor((bw - sideW - 8) / 9));
                    const rows = Math.max(3, Math.floor((b.h - 16) / 13));
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const hash = (b.litSeed * 17 + r * 7 + c * 13) % 11;
                            ctx.fillStyle = hash < 3 ? '#FDE047' : '#172554';
                            ctx.fillRect(bx + 5 + c * 9, by + 8 + r * 13, 5, 7);
                        }
                    }
                }

                for (const b of state.skylineFront) {
                    const bx = Math.round(b.x * W);
                    const bw = Math.max(28, Math.round(b.w * W));
                    if (clearCenterZone && bx + bw > centerLeft && bx < centerRight) {
                        continue;
                    }
                    const by = groundY - b.h;
                    const sideW = Math.max(7, Math.round(bw * 0.24));

                    ctx.fillStyle = b.c;
                    ctx.fillRect(bx, by, bw - sideW, b.h);
                    ctx.fillStyle = b.side;
                    ctx.fillRect(bx + bw - sideW, by, sideW, b.h);

                    ctx.fillStyle = '#93C5FD';
                    ctx.fillRect(bx - 1, by, bw + 2, 4);

                    ctx.strokeStyle = '#111827';
                    ctx.lineWidth = 2.2;
                    ctx.strokeRect(bx, by, bw, b.h);

                    if (b.roofType === 'watertower') {
                        const wx = bx + 10;
                        ctx.strokeStyle = '#111827';
                        ctx.lineWidth = 1.6;
                        ctx.beginPath();
                        ctx.moveTo(wx + 2, by);
                        ctx.lineTo(wx + 4, by - 7);
                        ctx.moveTo(wx + 12, by);
                        ctx.lineTo(wx + 10, by - 7);
                        ctx.stroke();

                        ctx.fillStyle = '#D97706';
                        ctx.fillRect(wx + 1, by - 16, 12, 9);
                        ctx.strokeRect(wx + 1, by - 16, 12, 9);
                    } else if (b.roofType === 'antenna') {
                        const ax = bx + (bw - sideW) * 0.5;
                        ctx.fillStyle = '#E2E8F0';
                        ctx.fillRect(ax - 1.5, by - 18, 3, 18);
                        ctx.fillRect(ax - 6, by - 13, 12, 2);
                    }

                    const cols = Math.max(2, Math.floor((bw - sideW - 8) / 10));
                    const rows = Math.max(3, Math.floor((b.h - 14) / 14));
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const hash = (b.litSeed * 13 + r * 5 + c * 11) % 9;
                            ctx.fillStyle = hash < 3 ? '#FEF08A' : '#1E3A8A';
                            ctx.fillRect(bx + 5 + c * 10, by + 9 + r * 14, 6, 8);
                        }
                    }
                }

                ctx.restore();
            }

            function drawScenicLake2005(lx, ly, rx, ry, rot = 0, hasDuck = false, seed = 0) {
                ctx.save();
                ctx.translate(lx, ly);
                ctx.rotate(rot);

                ctx.fillStyle = '#D97706';
                ctx.strokeStyle = '#111827';
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.ellipse(0, 0, rx + 4, ry + 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#0284C7';
                ctx.beginPath();
                ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#38BDF8';
                ctx.beginPath();
                ctx.ellipse(-rx * 0.14, -ry * 0.14, rx * 0.72, ry * 0.70, 0, 0, Math.PI * 2);
                ctx.fill();

                const waveShift = Math.sin(state.animClock * 2.4 + seed) * 2.5;
                ctx.strokeStyle = '#E0F2FE';
                ctx.lineWidth = 1.8;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-rx * 0.36 + waveShift, -ry * 0.25);
                ctx.lineTo(rx * 0.12 + waveShift, -ry * 0.25);
                ctx.moveTo(-rx * 0.20 - waveShift, ry * 0.15);
                ctx.lineTo(rx * 0.28 - waveShift, ry * 0.15);
                ctx.stroke();

                const padX = rx * 0.34;
                const padY = ry * 0.28;
                ctx.fillStyle = '#16A34A';
                ctx.beginPath();
                ctx.arc(padX, padY, Math.min(5.5, rx * 0.22), 0.25, Math.PI * 1.85);
                ctx.lineTo(padX, padY);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#F472B6';
                ctx.fillRect(padX - 1.5, padY - 2, 3.2, 3.2);

                ctx.fillStyle = '#94A3B8';
                ctx.strokeStyle = '#111827';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(-rx * 0.78, ry * 0.55, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.restore();

                const reedX = lx + rx * 0.65;
                const reedY = ly - ry * 0.55;
                ctx.strokeStyle = '#15803D';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(reedX, reedY + 4);
                ctx.lineTo(reedX - 2, reedY - 8);
                ctx.moveTo(reedX + 4, reedY + 4);
                ctx.lineTo(reedX + 6, reedY - 7);
                ctx.stroke();
                ctx.fillStyle = '#78350F';
                ctx.fillRect(reedX - 3.5, reedY - 10, 3, 5);
                ctx.fillRect(reedX + 4.5, reedY - 9, 3, 5);

                if (hasDuck) {
                    const dx = lx + Math.cos(state.animClock * 1.1 + seed) * (rx * 0.35);
                    const dy = ly + Math.sin(state.animClock * 1.1 + seed) * (ry * 0.25);
                    ctx.save();
                    ctx.translate(dx, dy);
                    ctx.fillStyle = '#FACC15';
                    ctx.strokeStyle = '#111827';
                    ctx.lineWidth = 1.4;
                    ctx.beginPath();
                    ctx.ellipse(0, 1, 4.5, 2.8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(3, -2, 2.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = '#F97316';
                    ctx.fillRect(4.8, -2.5, 2.5, 1.5);
                    ctx.restore();
                }
            }

            function drawTowerBlock2005(blk, angle = 0) {
                ctx.save();
                ctx.translate(blk.x, blk.y);
                if (angle !== 0) ctx.rotate(angle);

                const sq = blk.squash || 0;
                ctx.scale(1 + sq * 0.08, 1 - sq * 0.10);

                const w = blk.w;
                const h = blk.h;
                const hw = w / 2;
                const hh = h / 2;
                const t = blk.tier;

                if (blk.glow > 0) {
                    ctx.fillStyle = `rgba(255, 215, 0, ${blk.glow * 0.45})`;
                    ctx.fillRect(-hw - 6, -hh - 6, w + 12, h + 12);
                }

                if (blk.isRoof) {
                    const baseFill = blk.isGolden ? '#FFB300' : t.roof;
                    const slopeLight = blk.isGolden ? '#FFE066' : t.roofLight;
                    const slopeDark = blk.isGolden ? '#B45309' : '#0F172A';

                    ctx.beginPath();
                    ctx.moveTo(-hw - 4, hh);
                    ctx.lineTo(-hw * 0.65, -hh + 8);
                    ctx.lineTo(hw * 0.65, -hh + 8);
                    ctx.lineTo(hw + 4, hh);
                    ctx.closePath();
                    ctx.fillStyle = baseFill;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(-hw - 4, hh);
                    ctx.lineTo(-hw * 0.65, -hh + 8);
                    ctx.lineTo(0, -hh + 8);
                    ctx.lineTo(0, hh);
                    ctx.closePath();
                    ctx.fillStyle = slopeLight;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(hw * 0.35, -hh + 8);
                    ctx.lineTo(hw * 0.65, -hh + 8);
                    ctx.lineTo(hw + 4, hh);
                    ctx.lineTo(hw * 0.55, hh);
                    ctx.closePath();
                    ctx.fillStyle = slopeDark;
                    ctx.fill();

                    ctx.strokeStyle = '#111827';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(-hw - 4, hh);
                    ctx.lineTo(-hw * 0.65, -hh + 8);
                    ctx.lineTo(hw * 0.65, -hh + 8);
                    ctx.lineTo(hw + 4, hh);
                    ctx.closePath();
                    ctx.stroke();

                    ctx.strokeStyle = blk.isGolden ? '#B45309' : 'rgba(0,0,0,0.35)';
                    ctx.lineWidth = 1.5;
                    for (let i = -2; i <= 2; i++) {
                        ctx.beginPath();
                        ctx.moveTo(i * (hw * 0.25), -hh + 8);
                        ctx.lineTo(i * (hw * 0.36), hh);
                        ctx.stroke();
                    }

                    ctx.fillStyle = blk.isGolden ? '#FFFBEB' : t.trim;
                    ctx.fillRect(-hw - 5, hh - 7, w + 10, 7);
                    ctx.strokeStyle = '#111827';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-hw - 5, hh - 7, w + 10, 7);

                    ctx.fillStyle = blk.isGolden ? '#FFD700' : '#CBD5E1';
                    ctx.fillRect(-2.5, -hh - 14, 5, 22);
                    ctx.strokeRect(-2.5, -hh - 14, 5, 22);

                    ctx.beginPath();
                    ctx.arc(0, -hh - 16, 4.5, 0, Math.PI * 2);
                    ctx.fillStyle = blk.isGolden ? '#FFFFFF' : '#EF4444';
                    ctx.fill();
                    ctx.stroke();

                    if (blk.isGolden) {
                        const pulse = 0.5 + 0.5 * Math.sin(state.animClock * 9);
                        ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + pulse * 0.6})`;
                        ctx.fillRect(-hw * 0.35 - 3, -2, 6, 6);
                    }

                    ctx.restore();
                    return;
                }

                ctx.fillStyle = t.wall;
                ctx.fillRect(-hw, -hh, w, h);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.10)';
                for (let py = -hh + 14; py < hh - 6; py += 11) {
                    ctx.fillRect(-hw + 3, py, w - 6, 1.5);
                }

                ctx.fillStyle = t.wallLight;
                ctx.fillRect(-hw + 2, -hh + 2, Math.min(5, w * 0.08), h - 4);
                ctx.fillStyle = t.wallDark;
                ctx.fillRect(hw - w * 0.15, -hh + 2, w * 0.15 - 2, h - 4);

                if (w >= 46) {
                    ctx.fillStyle = t.trim;
                    for (let qy = -hh + 9; qy < hh - 9; qy += 12) {
                        ctx.fillRect(-hw + 1, qy, 4, 6);
                        ctx.fillRect(hw - 5, qy, 4, 6);
                    }
                }

                ctx.fillStyle = t.trim;
                ctx.fillRect(-hw - 2, -hh, w + 4, 7);
                ctx.strokeStyle = '#111827';
                ctx.lineWidth = 2;
                ctx.strokeRect(-hw - 2, -hh, w + 4, 7);

                ctx.fillStyle = t.wallDark;
                for (let dx = -hw + 4; dx < hw - 6; dx += 10) {
                    ctx.fillRect(dx, -hh + 4, 4, 2.5);
                }

                ctx.fillStyle = '#111827';
                ctx.fillRect(-hw, hh - 4, w, 4);

                ctx.strokeStyle = '#111827';
                ctx.lineWidth = 2.5;
                ctx.strokeRect(-hw, -hh, w, h);

                if (blk.isBase) {
                    const dw = w * 0.28;
                    const dh = h * 0.56;
                    ctx.fillStyle = '#0F172A';
                    ctx.fillRect(-dw / 2, hh - dh - 3, dw, dh);
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(-dw / 2, hh - dh - 3, dw, dh);

                    ctx.beginPath();
                    ctx.moveTo(0, hh - dh - 3);
                    ctx.lineTo(0, hh - 3);
                    ctx.stroke();

                    ctx.fillStyle = '#FACC15';
                    ctx.fillRect(-3.5, hh - dh * 0.52, 2, 4);
                    ctx.fillRect(1.5, hh - dh * 0.52, 2, 4);

                    const aw = dw * 1.45;
                    ctx.fillStyle = '#E53935';
                    ctx.fillRect(-aw / 2, hh - dh - 10, aw, 7);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(-aw / 4, hh - dh - 10, aw / 6, 7);
                    ctx.fillRect(aw / 12, hh - dh - 10, aw / 6, 7);
                    ctx.strokeStyle = '#111827';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-aw / 2, hh - dh - 10, aw, 7);

                    const ww = w * 0.15;
                    const wh = h * 0.34;
                    [-hw + w * 0.11, hw - w * 0.11 - ww].forEach(wx => {
                        ctx.fillStyle = t.windowLit;
                        ctx.fillRect(wx, -hh + 13, ww, wh);
                        ctx.strokeStyle = '#111827';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(wx, -hh + 13, ww, wh);
                    });
                } else {
                    const padX = Math.max(7, w * 0.11);
                    const padY = 11;
                    const gapX = 5;
                    const gapY = 5;
                    const availW = w - padX * 2;
                    const cols = Math.max(1, Math.min(3, Math.floor((availW + gapX) / 22)));
                    const rows = 2;
                    const ww = Math.max(8, (availW - gapX * (cols - 1)) / cols);
                    const wh = (h - padY - 7 - gapY * (rows - 1)) / rows;

                    let idx = 0;
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const wx = -hw + padX + c * (ww + gapX);
                            const wy = -hh + padY + r * (wh + gapY);
                            const lit = blk.litWindows && blk.litWindows[idx++ % blk.litWindows.length];

                            ctx.fillStyle = lit ? t.windowLit : t.windowOff;
                            ctx.fillRect(wx, wy, ww, wh);

                            if (lit) {
                                ctx.fillStyle = 'rgba(234, 88, 12, 0.35)';
                                ctx.fillRect(wx, wy, ww, 3);
                            } else {
                                ctx.fillStyle = 'rgba(255,255,255,0.24)';
                                ctx.beginPath();
                                ctx.moveTo(wx + 2, wy + wh - 2);
                                ctx.lineTo(wx + ww * 0.55, wy + 2);
                                ctx.lineTo(wx + ww * 0.85, wy + 2);
                                ctx.lineTo(wx + ww * 0.3, wy + wh - 2);
                                ctx.closePath();
                                ctx.fill();
                            }

                            ctx.strokeStyle = '#FFFFFF';
                            ctx.lineWidth = 1.4;
                            ctx.strokeRect(wx, wy, ww, wh);

                            if (ww >= 14) {
                                ctx.beginPath();
                                ctx.moveTo(wx + ww / 2, wy);
                                ctx.lineTo(wx + ww / 2, wy + wh);
                                ctx.stroke();
                            }

                            if (t.id === 'red' && r === 1) {
                                ctx.fillStyle = '#111827';
                                ctx.fillRect(wx - 1, wy + wh - 3, ww + 2, 3);
                            }
                        }
                    }
                }

                ctx.restore();
            }

                for (let i = 0; i < 4; i++) {
                    drawTowerBlock2005({
                        x: W / 2,
                        y: gY - demoH / 2 - i * demoH,
                        w: demoW,
                        h: demoH,
                        tier: demoTiers[i],
                        isBase: i === 0,
                        isRoof: false,
                        litWindows: [true, true, false, true, true, false]
                    });
                }
                drawTowerBlock2005({
                    x: W / 2,
                    y: gY - demoH / 2 - 4 * demoH,
                    w: demoW * 1.05,
                    h: demoH * 0.9,
                    tier: BUILDING_TYPES.yellow,
                    isRoof: true,
                    isGolden: true
                });

                drawStreetGround2005(gY, false);

                const panelW = Math.min(340, W - 28);
                const panelX = (W - panelW) / 2;
                const panelY = Math.max(24, H * 0.055);

                drawArcadeBox(panelX, panelY, panelW, 114, '#1E3A8A', '#0F172A', '#111827', '#FACC15');

                ctx.fillStyle = '#FACC15';
                ctx.font = `900 11px 'Arial Black', sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText('CITY BLOXX • ЗАСТРОЙЩИК', W / 2, panelY + 22);

                ctx.font = `900 ${Math.min(40, Math.round(panelW * 0.125))}px 'Arial Black', Impact, sans-serif`;
                ctx.fillStyle = '#111827';
                ctx.fillText('TOWER', W / 2 + 3, panelY + 58);
                ctx.fillStyle = '#FFE066';
                ctx.fillText('TOWER', W / 2, panelY + 55);

                ctx.fillStyle = '#111827';
                ctx.fillText('BLOXX', W / 2 + 3, panelY + 95);
                ctx.fillStyle = '#FF5252';
                ctx.fillText('BLOXX', W / 2, panelY + 92);

                const btnW = Math.min(270, W - 48);
                const btnX = (W - btnW) / 2;
                const btnStartY = panelY + 128;

                drawArcadeButton('btn_city', btnX, btnStartY, btnW, 50, 'ИГРАТЬ (ГОРОД)', 'gold', () => {
                    state.mode = 'CITY';
                    state.citySubMode = state.money < 0 ? 'BANKRUPT' : 'VIEW';
                }, 17);

                const totalPop = getAllCitiesTotalPop();
                const statY = btnStartY + 58;
                drawArcadeBox(btnX, statY, btnW, 42, '#0F172A', '#1E293B', '#111827', '#38BDF8');

                drawPixelPersonIcon(btnX + 22, statY + 20, 0.95);
                ctx.fillStyle = '#FFFFFF';
                ctx.font = `800 13px 'Trebuchet MS', sans-serif`;
                ctx.textAlign = 'left';
                ctx.fillText(`ЖИТЕЛЕЙ: ${totalPop}`, btnX + 38, statY + 21);

                ctx.fillStyle = '#4ADE80';
                ctx.textAlign = 'right';
                ctx.fillText(`КАССА: $${state.money}`, btnX + btnW - 12, statY + 21);

                const quickY = statY + 60;
                drawArcadeButton('btn_quick', btnX, quickY, btnW, 46, 'БЫСТРАЯ ИГРА', 'blue', () => {
                    startBuild('blue', true);
                }, 16);

                const portalY = quickY + 54;
                drawArcadeButton('btn_portal_back', btnX, portalY, btnW, 42, 'ПОРТАЛ', 'dark', () => {
                    window.location.href = 'index.html';
                }, 14);

                drawArcadeButton('btn_mute_title', W - 52, 12, 40, 38, '', 'dark', () => {
                    sfx.toggleMute();
                });
                drawSoundIcon(W - 32, 31, sfx.muted);

                const resetLabel = state.resetConfirm ? 'ТОЧНО СБРОС?' : 'СБРОС ГОРОДА';
                drawArcadeButton('btn_reset_city', 12, H - 46, 128, 34, resetLabel, state.resetConfirm ? 'red' : 'dark', () => {
                    if (!state.resetConfirm) {
                        state.resetConfirm = true;
                        setTimeout(() => { state.resetConfirm = false; }, 3000);
                    } else {
                        state.resetConfirm = false;
                        const fresh = createInitialSaveData();
                        state.money = fresh.money;
                        state.activeCity = fresh.activeCity;
                        state.city2Unlocked = fresh.city2Unlocked;
                        state.grids = fresh.grids;
                        state.pendingHouse = null;
                        state.inspectLot = null;
                        saveGrid();
                        showBanner('ПРОГРЕСС СБРОШЕН', 1.8);
                    }
                }, 11);
            }

            // =========================================================
            // 13. RENDER: CITY MAP 5x5 SCREEN (CITY 1 & CITY 2 "O-LAKE")
            // =========================================================
            function renderCityScreen() {
                const { boardSize, roadW, lotSize, startX, startY } = getCityGeometry();

                // 1. Базовый сочный луг с шахматным газоном
                const meadowGrad = ctx.createLinearGradient(0, 56, 0, H);
                meadowGrad.addColorStop(0, '#34A853');
                meadowGrad.addColorStop(0.5, '#2E9E44');
                meadowGrad.addColorStop(1, '#238236');
                ctx.fillStyle = meadowGrad;
                ctx.fillRect(0, 0, W, H);

                const tile = 44;
                ctx.fillStyle = 'rgba(22, 101, 52, 0.16)';
                for (let gx = 0; gx < W; gx += tile * 2) {
                    for (let gy = 56; gy < H - 56; gy += tile * 2) {
                        ctx.fillRect(gx, gy, tile, tile);
                        ctx.fillRect(gx + tile, gy + tile, tile, tile);
                    }
                }

                // 2. Извилистый ручей / речка с песчаными берегами и бликами
                ctx.save();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.strokeStyle = '#D97706';
                ctx.lineWidth = 28;
                ctx.beginPath();
                ctx.moveTo(-20, H * 0.22);
                ctx.bezierCurveTo(W * 0.16, H * 0.25, W * 0.12, H * 0.72, W * 0.30, H * 0.86);
                ctx.bezierCurveTo(W * 0.55, H * 0.94, W * 0.85, H * 0.78, W + 20, H * 0.68);
                ctx.stroke();

                ctx.strokeStyle = '#0284C7';
                ctx.lineWidth = 21;
                ctx.stroke();

                ctx.strokeStyle = '#38BDF8';
                ctx.lineWidth = 9;
                ctx.stroke();

                ctx.strokeStyle = '#E0F2FE';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([12, 22]);
                ctx.lineDashOffset = -state.animClock * 18;
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();

                // 3. Три живописных озера на внешней поляне
                const sideMargin = startX;
                const topMargin = startY - 62;
                const botMargin = (H - 60) - (startY + boardSize);

                if (sideMargin > 34) {
                    const rx1 = Math.min(28, sideMargin * 0.42);
                    const ry1 = Math.min(44, sideMargin * 0.65);
                    drawScenicLake2005(W - sideMargin * 0.50, H * 0.36, rx1, ry1, -0.18, true, 1.1);

                    const rx2 = Math.min(24, sideMargin * 0.38);
                    const ry2 = Math.min(34, sideMargin * 0.52);
                    drawScenicLake2005(sideMargin * 0.48, H * 0.64, rx2, ry2, 0.25, false, 2.7);
                }

                if (topMargin > 36) {
                    drawScenicLake2005(W * 0.28, 62 + topMargin * 0.48, 28, Math.min(18, topMargin * 0.36), 0.08, true, 4.3);
                } else if (botMargin > 36) {
                    drawScenicLake2005(W * 0.72, startY + boardSize + botMargin * 0.50, 28, Math.min(18, botMargin * 0.36), -0.08, true, 4.3);
                } else if (sideMargin > 42) {
                    drawScenicLake2005(W - sideMargin * 0.48, H * 0.62, Math.min(20, sideMargin * 0.32), 26, 0.2, false, 4.3);
                }

                // 4. Полевые цветы и кустики
                for (const fl of state.meadowFlowers) {
                    const px = fl.fx * W;
                    const py = fl.fy * H;
                    if (px < startX - 10 || px > startX + boardSize + 10 || py < startY - 10 || py > startY + boardSize + 10) {
                        if (fl.hasBush) {
                            ctx.fillStyle = '#15803D';
                            ctx.beginPath();
                            ctx.arc(px, py + 2, 5.5, Math.PI, 0);
                            ctx.fill();
                        }
                        ctx.fillStyle = fl.col1;
                        ctx.fillRect(px - 3, py - 3, 2.6, 2.6);
                        ctx.fillRect(px + 1, py - 4, 2.6, 2.6);
                        ctx.fillStyle = fl.col2;
                        ctx.fillRect(px - 1, py - 1, 2.6, 2.6);
                        ctx.fillRect(px + 2, py, 2.4, 2.4);
                    }
                }

                // 5. Рощи лиственных деревьев и елей
                for (let i = 0; i < state.parkTrees.length; i++) {
                    const pt = state.parkTrees[i];
                    const tx = pt.nx * W;
                    const ty = pt.ny * H;
                    if (tx < startX - 8 || tx > startX + boardSize + 8 || ty < startY - 8 || ty > startY + boardSize + 14) {
                        if (pt.pine) {
                            drawPineTree2005(tx, ty, pt.s);
                        } else {
                            drawCartoonTree2005(tx, ty, pt.s);
                        }
                    }
                }

                // Outer City Board Frame & Asphalt Road Network
                drawArcadeBox(
                    startX - 4,
                    startY - 4,
                    boardSize + 8,
                    boardSize + 8,
                    '#475569',
                    '#334155',
                    '#111827',
                    '#94A3B8'
                );

                ctx.strokeStyle = '#F8FAFC';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                for (let i = 0; i <= GRID_SIZE; i++) {
                    const rx = startX + roadW / 2 + i * (lotSize + roadW);
                    ctx.beginPath();
                    ctx.moveTo(rx, startY + 4);
                    ctx.lineTo(rx, startY + boardSize - 4);
                    ctx.stroke();

                    const ry = startY + roadW / 2 + i * (lotSize + roadW);
                    ctx.beginPath();
                    ctx.moveTo(startX + 4, ry);
                    ctx.lineTo(startX + boardSize - 4, ry);
                    ctx.stroke();
                }
                ctx.setLineDash([]);

                ctx.fillStyle = 'rgba(248, 250, 252, 0.72)';
                for (let r = 1; r < GRID_SIZE; r++) {
                    for (let c = 1; c < GRID_SIZE; c++) {
                        const ix = startX + c * (lotSize + roadW);
                        const iy = startY + r * (lotSize + roadW);
                        ctx.fillRect(ix - 5, iy + 2, 3, roadW - 4);
                        ctx.fillRect(ix + roadW + 2, iy + 2, 3, roadW - 4);
                    }
                }

                for (const car of state.cars) {
                    ctx.fillStyle = car.color;
                    ctx.strokeStyle = '#111827';
                    ctx.lineWidth = 1.8;
                    if (car.axis === 'h') {
                        const cy = startY + roadW / 2 + car.road * (lotSize + roadW);
                        const cx = startX + car.t * boardSize;
                        if (cx > startX + 4 && cx < startX + boardSize - 4) {
                            ctx.fillRect(cx - 7, cy - 4, 14, 8);
                            ctx.strokeRect(cx - 7, cy - 4, 14, 8);
                        }
                    } else {
                        const cx = startX + roadW / 2 + car.road * (lotSize + roadW);
                        const cy = startY + car.t * boardSize;
                        if (cy > startY + 4 && cy < startY + boardSize - 4) {
                            ctx.fillRect(cx - 4, cy - 7, 8, 14);
                            ctx.strokeRect(cx - 4, cy - 7, 8, 14);
                        }
                    }
                }

                for (const ped of state.pedestrians) {
                    ctx.fillStyle = ped.shirt;
                    if (ped.axis === 'h') {
                        const py = startY + roadW / 2 + ped.road * (lotSize + roadW) + ped.side * (roadW * 0.35);
                        const px = startX + ped.t * boardSize;
                        if (px > startX && px < startX + boardSize) ctx.fillRect(px - 2, py - 2, 4, 4);
                    } else {
                        const px = startX + roadW / 2 + ped.road * (lotSize + roadW) + ped.side * (roadW * 0.35);
                        const py = startY + ped.t * boardSize;
                        if (py > startY && py < startY + boardSize) ctx.fillRect(px - 2, py - 2, 4, 4);
                    }
                }

                const blink = 0.5 + 0.5 * Math.sin(state.animClock * 7);

                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        const rect = getLotRect(r, c);

                        // Если это Город №2 (буквой О), центральные клетки 1..3 x 1..3 заняты единым озером!
                        if (isCellLakeInCity(state.activeCity, r, c)) {
                            continue;
                        }

                        const cell = state.cityGrid[r][c];

                        ctx.fillStyle = cell ? '#4ADE80' : '#86EFAC';
                        ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
                        ctx.strokeStyle = '#111827';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);

                        if (!cell) {
                            const pad = Math.round(rect.w * 0.16);
                            ctx.fillStyle = '#BEF264';
                            ctx.fillRect(rect.x + pad, rect.y + pad, rect.w - pad * 2, rect.h - pad * 2);

                            ctx.fillStyle = '#15803D';
                            ctx.fillRect(rect.x + 3, rect.y + 3, 5, 5);
                            ctx.fillRect(rect.x + rect.w - 8, rect.y + 3, 5, 5);

                            if (state.citySubMode === 'PLACING' && state.pendingHouse) {
                                const check = evaluatePlacement(r, c, state.pendingHouse.type, state.pendingHouse);
                                if (check.valid) {
                                    ctx.fillStyle = `rgba(250, 204, 21, ${0.35 + blink * 0.35})`;
                                    ctx.fillRect(rect.x + 2, rect.y + 2, rect.w - 4, rect.h - 4);
                                    ctx.strokeStyle = '#FFD700';
                                    ctx.lineWidth = 3;
                                    ctx.strokeRect(rect.x + 2, rect.y + 2, rect.w - 4, rect.h - 4);

                                    ctx.fillStyle = '#111827';
                                    ctx.font = `900 ${Math.max(10, Math.round(rect.w * 0.21))}px 'Arial Black', sans-serif`;
                                    ctx.textAlign = 'center';
                                    ctx.textBaseline = 'middle';
                                    ctx.fillText(`0/${check.pop}`, rect.x + rect.w / 2, rect.y + rect.h / 2);
                                } else {
                                    ctx.fillStyle = 'rgba(15, 23, 42, 0.42)';
                                    ctx.fillRect(rect.x + 2, rect.y + 2, rect.w - 4, rect.h - 4);
                                }
                            } else {
                                ctx.fillStyle = '#15803D';
                                ctx.font = `900 ${Math.round(rect.w * 0.34)}px 'Arial Black', sans-serif`;
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillText('+', rect.x + rect.w / 2, rect.y + rect.h / 2 + 1);
                            }

                            if (state.citySubMode === 'VIEW' || state.citySubMode === 'PLACING') {
                                registerHitbox(`lot_${r}_${c}`, rect.x, rect.y, rect.w, rect.h, () => {
                                    if (state.citySubMode === 'PLACING') {
                                        placePendingHouse(r, c);
                                    } else {
                                        sfx.click();
                                        state.selectedLot = { r, c };
                                        state.citySubMode = 'SELECT_BUILDING';
                                    }
                                });
                            }
                        } else {
                            const isRelocTarget = state.citySubMode === 'RELOCATE_PICK' &&
                                state.inspectLot &&
                                !(state.inspectLot.r === r && state.inspectLot.c === c) &&
                                (cell.maxPop - cell.currentPop > 0);

                            drawCityLotBuilding(rect, cell, state.citySubMode === 'DEMOLISH', isRelocTarget);

                            registerHitbox(`occ_${r}_${c}`, rect.x, rect.y, rect.w, rect.h, () => {
                                if (state.citySubMode === 'RELOCATE_PICK' && state.inspectLot) {
                                    if (isRelocTarget) {
                                        startRelocationProcess(state.inspectLot.r, state.inspectLot.c, r, c);
                                    } else {
                                        sfx.miss();
                                        showBanner('В ЭТОМ ДОМЕ НЕТ СВОБОДНЫХ МЕСТ', 1.8);
                                    }
                                } else if (state.citySubMode === 'DEMOLISH' || state.citySubMode === 'VIEW') {
                                    sfx.click();
                                    state.inspectLot = { r, c };
                                    state.citySubMode = 'HOUSE_MENU';
                                }
                            });
                        }
                    }
                }

                // Отрисовка большого центрального озера в Городе №2 (буквой "О")
                if (state.activeCity === 1) {
                    const topLeftLake = getLotRect(1, 1);
                    const botRightLake = getLotRect(3, 3);
                    const lakeX = topLeftLake.x - roadW * 0.4;
                    const lakeY = topLeftLake.y - roadW * 0.4;
                    const lakeW = (botRightLake.x + botRightLake.w + roadW * 0.4) - lakeX;
                    const lakeH = (botRightLake.y + botRightLake.h + roadW * 0.4) - lakeY;

                    // Зелёный островок-набережная вокруг центрального озера
                    ctx.fillStyle = '#22C55E';
                    ctx.fillRect(lakeX, lakeY, lakeW, lakeH);
                    ctx.strokeStyle = '#111827';
                    ctx.lineWidth = 2.5;
                    ctx.strokeRect(lakeX, lakeY, lakeW, lakeH);

                    drawScenicLake2005(
                        lakeX + lakeW / 2,
                        lakeY + lakeH / 2,
                        lakeW * 0.41,
                        lakeH * 0.41,
                        0,
                        true,
                        7.7
                    );
                }

                // =======================================
                // TOP J2ME CITY HUD BAR (ДЕНЬГИ + ЖИТЕЛИ + ГОРОД)
                // =======================================
                const stats = getCityStats();
                const allPop = getAllCitiesTotalPop();
                const targetPop = getNextTargetPop(allPop);
                const topH = 54;

                drawArcadeBox(6, 6, W - 12, topH, '#1E3A8A', '#0F172A', '#111827', '#38BDF8');

                // Касса Застройщика ($)
                ctx.fillStyle = state.money >= 0 ? '#4ADE80' : '#F87171';
                ctx.font = `900 14px 'Arial Black', sans-serif`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(`$${state.money}`, 16, 23);

                // Население города (жители / вместимость)
                drawPixelPersonIcon(22, 42, 0.72);
                ctx.fillStyle = '#FACC15';
                ctx.font = `900 11px 'Arial Black', sans-serif`;
                ctx.fillText(`${stats.totalPop}/${stats.maxCapacity}`, 34, 42);

                // Кнопка переключения / покупки Города №2 ("О-ОЗЕРО")
                const cityBtnX = Math.max(106, Math.min(126, W * 0.30));
                const cityBtnW = Math.max(82, Math.min(118, W - cityBtnX - 114));
                const cityLabel = state.city2Unlocked
                    ? (state.activeCity === 0 ? 'ГОРОД 1 ⇄ 2' : 'ГОРОД-О ⇄ 1')
                    : `ГОРОД-О $${CITY2_REQ_MONEY}`;
                const cityScheme = state.city2Unlocked
                    ? 'blue'
                    : (allPop >= CITY2_REQ_POP && state.money >= CITY2_REQ_MONEY ? 'green' : 'dark');

                drawArcadeButton('btn_switch_city', cityBtnX, 13, cityBtnW, 40, cityLabel, cityScheme, () => {
                    if (state.city2Unlocked) {
                        state.activeCity = state.activeCity === 0 ? 1 : 0;
                        state.citySubMode = 'VIEW';
                        state.inspectLot = null;
                        saveGrid();
                        showBanner(state.activeCity === 1 ? 'ГОРОД-ОЗЕРО (БУКВОЙ О)' : 'СТАРТОВЫЙ ГОРОД', 1.8);
                    } else {
                        if (allPop >= CITY2_REQ_POP && state.money >= CITY2_REQ_MONEY) {
                            state.money -= CITY2_REQ_MONEY;
                            state.city2Unlocked = true;
                            state.activeCity = 1;
                            state.citySubMode = 'VIEW';
                            saveGrid();
                            sfx.goldenRoof();
                            showBanner('НОВЫЙ ГОРОД-ОЗЕРО КУПЛЕН!', 2.6);
                        } else {
                            sfx.miss();
                            showBanner(`НУЖНО ${CITY2_REQ_POP} ЖИТ. И $${CITY2_REQ_MONEY}`, 2.4);
                        }
                    }
                }, 10);

                // Sound & Menu Buttons
                drawArcadeButton('city_mute', W - 104, 13, 38, 40, '', 'dark', () => {
                    sfx.toggleMute();
                });
                drawSoundIcon(W - 85, 33, sfx.muted);

                drawArcadeButton('city_menu', W - 62, 13, 50, 40, 'МЕНЮ', 'gold', () => {
                    state.mode = 'TITLE';
                    state.citySubMode = 'VIEW';
                }, 11);

                // =======================================
                // BOTTOM CITY ACTION BAR
                // =======================================
                const botY = H - 56;
                if (state.citySubMode === 'PLACING' && state.pendingHouse) {
                    const t = BUILDING_TYPES[state.pendingHouse.type];
                    drawArcadeBox(8, botY, W - 16, 48, '#065F46', '#064E3B', '#111827', '#4ADE80');
                    drawMiniHouseIcon(32, botY + 24, t, state.pendingHouse.isGoldenRoof, 0.85);

                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = `900 12px 'Arial Black', sans-serif`;
                    ctx.textAlign = 'left';
                    ctx.fillText(
                        state.pendingHouse.isGoldenRoof ? `${t.name} (ЗОЛОТАЯ x2)` : t.name,
                        54,
                        botY + 18
                    );
                    ctx.fillStyle = '#FACC15';
                    ctx.font = `800 11px 'Trebuchet MS', sans-serif`;
                    ctx.fillText('НАЖМИ НА МИГАЮЩИЙ УЧАСТОК', 54, botY + 35);

                    drawArcadeButton('cancel_place', W - 92, botY + 6, 78, 36, 'ОТМЕНА', 'red', () => {
                        state.pendingHouse = null;
                        state.citySubMode = 'VIEW';
                    }, 11);
                } else if (state.citySubMode === 'RELOCATE_PICK') {
                    drawArcadeBox(8, botY, W - 16, 48, '#1E3A8A', '#0F172A', '#111827', '#38BDF8');
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = `900 11px 'Arial Black', sans-serif`;
                    ctx.textAlign = 'left';
                    ctx.fillText('ВЫБЕРИ ДОМ С МЕСТАМИ ДЛЯ ПЕРЕСЕЛЕНИЯ', 18, botY + 24);

                    drawArcadeButton('cancel_reloc', W - 92, botY + 6, 78, 36, 'ОТМЕНА', 'red', () => {
                        state.citySubMode = 'HOUSE_MENU';
                    }, 11);
                } else {
                    const buildW = Math.min(230, W - 114);
                    const totalW = buildW + 86;
                    const startBtnX = (W - totalW) / 2;

                    drawArcadeButton('btn_open_build', startBtnX, botY, buildW, 48, 'ПОСТРОИТЬ ДОМ', 'gold', () => {
                        state.selectedLot = null;
                        state.citySubMode = 'SELECT_BUILDING';
                    }, 15);

                    const isDem = state.citySubMode === 'DEMOLISH';
                    drawArcadeButton('btn_demolish', startBtnX + buildW + 8, botY, 78, 48, isDem ? 'ОТМЕНА' : 'СНОС', isDem ? 'red' : 'dark', () => {
                        state.citySubMode = isDem ? 'VIEW' : 'DEMOLISH';
                        if (!isDem) showBanner('НАЖМИ НА ДОМ ДЛЯ РАССЕЛЕНИЯ / СНОСА', 2.2);
                    }, 12);
                }

                // =======================================
                // МОДАЛЬНЫЕ ОКНА: СТРОЙКА, ДОМ (АВИТО/СНОС), АВИТО, ПЕРЕСЕЛЕНИЕ, СУД, БАНКРОТСТВО
                // =======================================
                if (state.citySubMode === 'SELECT_BUILDING') {
                    renderBuildingSelectorOverlay();
                } else if (state.citySubMode === 'HOUSE_MENU' && state.inspectLot) {
                    renderHouseInspectModal();
                } else if (state.citySubMode === 'AVITO') {
                    renderAvitoBargainModal();
                } else if (state.citySubMode === 'RELOCATE_RESULT') {
                    renderRelocateResultModal();
                } else if (state.citySubMode === 'COURT') {
                    renderCourtMiniGameModal();
                } else if (state.citySubMode === 'BANKRUPT') {
                    renderBankruptModal();

            function drawCityLotBuilding(rect, cell, isDemolish, isRelocTarget = false) {
                const t = BUILDING_TYPES[cell.type];
                const lift = (cell.dropAnim || 0) * 34;
                const towerH = Math.min(rect.h * 0.65, 10 + cell.floors * 0.9);

                const bx = rect.x + rect.w * 0.14;
                const bw = rect.w * 0.72;
                const baseTop = rect.y + rect.h * 0.24 - lift;
                const bh = rect.h * 0.62;
                const roofTop = baseTop - towerH * 0.42;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.42)';
                ctx.fillRect(bx + 4, rect.y + rect.h * 0.27, bw, bh);

                ctx.fillStyle = t.wallDark;
                ctx.fillRect(bx, roofTop, bw, bh + towerH * 0.42);

                ctx.fillStyle = cell.isGoldenRoof ? '#FFD700' : t.wall;
                ctx.fillRect(bx, roofTop, bw, bh * 0.76);

                const inset = bw * 0.18;
                ctx.fillStyle = cell.isGoldenRoof ? '#FFFBEB' : t.roof;
                ctx.fillRect(bx + inset, roofTop + inset * 0.8, bw - inset * 2, bh * 0.76 - inset * 1.6);

                if (cell.isGoldenRoof) {
                    ctx.fillStyle = '#F59E0B';
                    ctx.beginPath();
                    ctx.arc(bx + bw / 2, roofTop + bh * 0.38, bw * 0.15, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = t.trim;
                    ctx.fillRect(bx + inset + 3, roofTop + inset + 2, bw * 0.22, bh * 0.2);
                }

                // Подсветка зелёной рамкой при выборе дома для переселения, или красной при сносе
                ctx.strokeStyle = isRelocTarget ? '#38BDF8' : isDemolish ? '#EF4444' : '#111827';
                ctx.lineWidth = (isRelocTarget || isDemolish) ? 3.2 : 2;
                ctx.strokeRect(bx, roofTop, bw, bh + towerH * 0.42);

                // Бейдж "АВИТО" над домом, если в нём есть непроданные квартиры
                if (cell.currentPop < cell.maxPop && !isRelocTarget) {
                    const pulse = 0.75 + 0.25 * Math.sin(state.animClock * 5 + rect.x);
                    ctx.fillStyle = `rgba(34, 197, 94, ${pulse})`;
                    ctx.fillRect(rect.x + rect.w - 16, rect.y + 3, 13, 13);
                    ctx.strokeStyle = '#111827';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(rect.x + rect.w - 16, rect.y + 3, 13, 13);
                    ctx.fillStyle = '#111827';
                    ctx.font = `900 9px 'Arial Black', sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('$', rect.x + rect.w - 9.5, rect.y + 9.5);
                }

                // Плашка заселённости: текущие жители / вместимость (например 0/100 или 60/100)
                const tagH = Math.max(13, Math.round(rect.h * 0.22));
                const tagY = rect.y + rect.h - tagH - 2;
                ctx.fillStyle = '#111827';
                ctx.fillRect(rect.x + 3, tagY, rect.w - 6, tagH);

                ctx.fillStyle = cell.currentPop >= cell.maxPop
                    ? (cell.isGoldenRoof ? '#FFD700' : '#4ADE80')
                    : '#FFFFFF';
                ctx.font = `900 ${Math.max(8, Math.round(tagH * 0.64))}px 'Arial Black', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`${cell.currentPop}/${cell.maxPop}`, rect.x + rect.w / 2, tagY + tagH / 2 + 0.5);
            }

            // Мини-игра №2: Судебное заседание (3 этапа)
            function renderCourtMiniGameModal() {
                const ct = state.court;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
                ctx.fillRect(0, 0, W, H);

                const mw = Math.min(356, W - 20);
                const mh = 278;
                const mx = Math.round((W - mw) / 2);
                const my = Math.round((H - mh) / 2);

                drawArcadeBox(mx, my, mw, mh, '#312E81', '#0F172A', '#111827', '#FACC15');

                ctx.fillStyle = '#FACC15';
                ctx.font = `900 15px 'Arial Black', sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(`ГОРОДСКОЙ СУД • ${ct.stageTitle}`, W / 2, my + 24);

                ctx.fillStyle = '#E2E8F0';
                ctx.font = `800 11px 'Trebuchet MS', sans-serif`;
                ctx.fillText(
                    `Победа: платите $0  |  Проигрыш: $${Math.round(ct.baseDebt * 1.25)} (+25%)`,
                    W / 2,
                    my + 45
                );

                // Индикатор прогресса 3 этапов суда
                for (let st = 1; st <= 3; st++) {
                    const pillW = 86;
                    const gap = 10;
                    const px = W / 2 - (pillW * 1.5 + gap) + (st - 1) * (pillW + gap);
                    const py = my + 58;
                    const done = ct.stage > st || (ct.finished && ct.won);
                    const active = ct.stage === st && !ct.finished;
                    ctx.fillStyle = done ? '#16A34A' : active ? '#F59E0B' : '#1E293B';
                    ctx.fillRect(px, py, pillW, 18);
                    ctx.strokeStyle = '#111827';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(px, py, pillW, 18);

                    ctx.fillStyle = done || active ? '#111827' : '#94A3B8';
                    ctx.font = `900 9px 'Arial Black', sans-serif`;
                    ctx.fillText(`ЭТАП ${st}`, px + pillW / 2, py + 9.5);
                }

                const barX = mx + 22;
                const barW = mw - 44;

                if (ct.stage === 1) {
                    // ЭТАП 1: Узкая движущаяся зелёная зона + быстрый маркер
                    const barY = my + 94;
                    const barH = 36;

                    ctx.fillStyle = '#7F1D1D';
                    ctx.fillRect(barX, barY, barW, barH);

                    const gx = barX + (ct.zoneCenter - ct.zoneWidth / 2) * barW;
                    const gw = ct.zoneWidth * barW;
                    ctx.fillStyle = '#16A34A';
                    ctx.fillRect(gx, barY, gw, barH);

                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(barX, barY, barW, barH);

                    const mxPos = barX + ct.markerPos * barW;
                    ctx.fillStyle = '#FACC15';
                    ctx.fillRect(mxPos - 4, barY - 6, 8, barH + 12);
                    ctx.strokeStyle = '#111827';
                    ctx.strokeRect(mxPos - 4, barY - 6, 8, barH + 12);

                    ctx.fillStyle = '#CBD5E1';
                    ctx.font = `800 11px 'Trebuchet MS', sans-serif`;
                    ctx.fillText('Поймайте бегунок в движущейся зелёной зоне!', W / 2, my + 150);
                } else if (ct.stage === 2) {
                    // ЭТАП 2: 3 последовательные цели для аргументов
                    const barY = my + 94;
                    const barH = 36;

                    ctx.fillStyle = '#1E293B';
                    ctx.fillRect(barX, barY, barW, barH);

                    ct.s2Targets.forEach((tgt, idx) => {
                        const tx = barX + (tgt - ct.s2Tol) * barW;
                        const tw = ct.s2Tol * 2 * barW;
                        const isPassed = idx < ct.s2Step;
                        const isCurrent = idx === ct.s2Step;
                        ctx.fillStyle = isPassed ? '#16A34A' : isCurrent ? '#F59E0B' : '#475569';
                        ctx.fillRect(tx, barY, tw, barH);
                        ctx.strokeStyle = '#111827';
                        ctx.lineWidth = 1.5;
                        ctx.strokeRect(tx, barY, tw, barH);

                        ctx.fillStyle = '#111827';
                        ctx.font = `900 10px 'Arial Black', sans-serif`;
                        ctx.fillText(`${idx + 1}`, tx + tw / 2, barY + barH / 2);
                    });

                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(barX, barY, barW, barH);

                    const mxPos = barX + ct.s2Pos * barW;
                    ctx.fillStyle = '#38BDF8';
                    ctx.fillRect(mxPos - 4, barY - 6, 8, barH + 12);
                    ctx.strokeStyle = '#111827';
                    ctx.strokeRect(mxPos - 4, barY - 6, 8, barH + 12);

                    ctx.fillStyle = '#CBD5E1';

                    const zoneX = barX + (ct.s3Center - ct.s3HalfWidth) * barW;
                    const zoneW = ct.s3HalfWidth * 2 * barW;

                    // Верхняя шкала
                    const topY = my + 86;
                    const rowH = 22;
                    ctx.fillStyle = '#7F1D1D';
                    ctx.fillRect(barX, topY, barW, rowH);
                    ctx.fillStyle = '#16A34A';
                    ctx.fillRect(zoneX, topY, zoneW, rowH);
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(barX, topY, barW, rowH);

                    const topCur = barX + ct.s3TopPos * barW;
                    ctx.fillStyle = '#FACC15';
                    ctx.fillRect(topCur - 4, topY - 4, 8, rowH + 8);
                    ctx.strokeStyle = '#111827';
                    ctx.strokeRect(topCur - 4, topY - 4, 8, rowH + 8);

                    // Нижняя шкала
                    const botY = my + 116;
                    ctx.fillStyle = '#7F1D1D';
                    ctx.fillRect(barX, botY, barW, rowH);
                    ctx.fillStyle = '#16A34A';
                    ctx.fillRect(zoneX, botY, zoneW, rowH);
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(barX, botY, barW, rowH);

                    const botCur = barX + ct.s3BotPos * barW;
                    ctx.fillStyle = '#38BDF8';
                    ctx.fillRect(botCur - 4, botY - 4, 8, rowH + 8);
                    ctx.strokeStyle = '#111827';
                    ctx.strokeRect(botCur - 4, botY - 4, 8, rowH + 8);

                    ctx.fillStyle = ct.s3TimeLeft <= 1.5 ? '#F87171' : '#FACC15';
                    ctx.font = `900 11px 'Arial Black', sans-serif`;
                    ctx.fillText(
                        `Сведите ОБА бегунка в центр! Осталось: ${ct.s3TimeLeft.toFixed(1)}с`,

            // =========================================================
            // 14. RENDER: TOWER BUILD SCREEN + PARALLAX SKYLINE
            // =========================================================
            function renderBuildScreen() {
                const b = state.build;
                const alt = b.cameraY;

                let cTop = '#0284C7';
                let cBot = '#BAE6FD';
                let starAlpha = 0;
                let sunAlpha = 1;

                if (alt > 650 && alt <= 1750) {
                    const t = (alt - 650) / 1100;
                    cTop = lerpColor('#0284C7', '#1E3A8A', t);
                    cBot = lerpColor('#BAE6FD', '#60A5FA', t);
                    sunAlpha = Math.max(0, 1 - t * 0.9);
                } else if (alt > 1750) {
                    const t = Math.min(1, (alt - 1750) / 1200);
                    cTop = lerpColor('#1E3A8A', '#090D16', t);
                    cBot = lerpColor('#60A5FA', '#1E1B4B', t);
                    starAlpha = t * 0.92;
                    sunAlpha = 0;
                }

                const sky = ctx.createLinearGradient(0, 0, 0, H);
                sky.addColorStop(0, cTop);
                sky.addColorStop(1, cBot);
                ctx.fillStyle = sky;
                ctx.fillRect(0, 0, W, H);

                drawSunWithRays(W * 0.84, H * 0.14 + alt * 0.08, 28, sunAlpha);

                if (starAlpha > 0.02) {
                    for (const s of state.stars) {
                        const tw = 0.5 + 0.5 * Math.sin(state.animClock * 4 + s.phase);
                        ctx.fillStyle = `rgba(255,255,255,${starAlpha * tw})`;
                        ctx.fillRect(s.x * W, s.y * H, s.r * 1.6, s.r * 1.6);
                    }
                }

                for (const c of state.clouds) {
                    const cy = (H - 120 - c.alt) + b.cameraY * 0.65;
                    if (cy > -80 && cy < H + 80) {
                        drawCloud2005(c.x * W, cy, c.scale);
                    }
                }

                const blimpY = (H - 120 - state.blimp.alt) + b.cameraY * 0.7;
                if (blimpY > 40 && blimpY < H - 60) {
                    drawBlimp2005(state.blimp.x * W, blimpY);
                }

                for (const bird of state.birds) {
                    const by = (H - 120 - bird.alt) + b.cameraY * 0.72;
                    if (by > 40 && by < H - 80) {
                        const bx = bird.x * W;
                        const wing = Math.sin(bird.flap) * 4;
                        ctx.strokeStyle = '#111827';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(bx - 7, by - wing);
                        ctx.quadraticCurveTo(bx - 3, by - 4, bx, by);
                        ctx.quadraticCurveTo(bx + 3, by - 4, bx + 7, by - wing);
                        ctx.stroke();
                    }
                }

                const groundY = (H - 84) + b.cameraY;
                if (groundY < H + 260) {
                    drawCitySkylineLayer(groundY, -b.cameraY * 0.22, true);
                    drawStreetGround2005(groundY, true);
                }

                ctx.save();
                let sx = 0, sy = 0;
                if (b.shakeTime > 0) {
                    sx = (Math.random() - 0.5) * 2 * b.shakeMag;
                    sy = (Math.random() - 0.5) * 2 * b.shakeMag;
                }
                ctx.translate(sx, b.cameraY + sy);

                for (const blk of b.blocks) {
                    drawTowerBlock2005(blk, 0);
                }

                if (b.activeBlock && b.activeBlock.state === 'SWINGING') {
                    const ab = b.activeBlock;
                    const top = b.blocks[b.blocks.length - 1];
                    const supportW = top.isBase ? b.baseBlockW : top.w;
                    const centerTol = Math.max(9, Math.min(supportW, ab.w) * 0.11);
                    const aligned = Math.abs(ab.x - top.x) <= centerTol;

                    if (ab.isRoof) {
                        const topEdgeY = top.y - top.h / 2;
                        if (b.flawless) {
                            ctx.fillStyle = aligned ? '#FFD700' : 'rgba(255, 215, 0, 0.55)';
                            ctx.fillRect(top.x - centerTol, topEdgeY - 5, centerTol * 2, 5);
                            ctx.strokeStyle = '#111827';
                            ctx.lineWidth = 1.5;
                            ctx.strokeRect(top.x - centerTol, topEdgeY - 5, centerTol * 2, 5);
                        }
                    }

                    ctx.save();
                    ctx.setLineDash([5, 5]);
                    ctx.lineWidth = aligned ? 2.5 : 1.5;
                    ctx.strokeStyle = aligned ? '#FFD700' : 'rgba(255, 255, 255, 0.45)';
                    ctx.beginPath();
                    ctx.moveTo(ab.x, ab.y + ab.h / 2 + 3);
                    ctx.lineTo(ab.x, top.y - top.h / 2);
                    ctx.stroke();

                    ctx.lineWidth = 1.8;
                    ctx.strokeRect(-dc.w / 2, -dc.h / 2, dc.w, dc.h);

                // TOP J2ME BUILD HUD BAR

                ctx.strokeRect(badgeX, 17, badgeW, 30);

                ctx.fillStyle = b.roofPhase ? '#111827' : '#FFFFFF';

                const heartsStartX = W - 174;

                drawArcadeButton('build_restart', W - 110, 13, 32, 38, '↻', 'gold', () => {

            function drawCrane2005() {
                const b = state.build;
                const px = W / 2;
                const py = -b.cameraY + 66;
                const halfBoom = Math.min(W * 0.44, 195);

                ctx.save();
                ctx.fillStyle = '#FACC15';
                ctx.strokeStyle = '#111827';
                ctx.lineWidth = 2.5;
                ctx.fillRect(px - halfBoom, py - 14, halfBoom * 2, 14);
                ctx.strokeRect(px - halfBoom, py - 14, halfBoom * 2, 14);

                ctx.strokeStyle = '#DC2626';
                ctx.lineWidth = 2.6;
                ctx.beginPath();
                const step = 16;
                let tx = px - halfBoom + 8;
                let up = false;
                ctx.moveTo(tx, py - 2);
                while (tx + step <= px + halfBoom - 8) {
                    tx += step;
                    up = !up;
                    ctx.lineTo(tx, up ? py - 12 : py - 2);
                }
                ctx.stroke();

                ctx.fillStyle = '#DC2626';
                ctx.fillRect(px - halfBoom - 3, py - 16, 6, 18);
                ctx.strokeRect(px - halfBoom - 3, py - 16, 6, 18);
                ctx.fillRect(px + halfBoom - 3, py - 16, 6, 18);
                ctx.strokeRect(px + halfBoom - 3, py - 16, 6, 18);

                const trolleyX = (b.activeBlock && b.activeBlock.state === 'SWINGING')
                    ? b.activeBlock.x
                    : px + b.crane.angle * Math.min(W * 0.34, 155);

                ctx.fillStyle = '#1E293B';
                ctx.fillRect(trolleyX - 14, py - 17, 28, 20);
                ctx.strokeRect(trolleyX - 14, py - 17, 28, 20);

                ctx.fillStyle = '#FACC15';
                ctx.beginPath();
                ctx.arc(trolleyX - 8, py - 7, 3.5, 0, Math.PI * 2);
                ctx.arc(trolleyX + 8, py - 7, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                if (b.activeBlock && b.activeBlock.state === 'SWINGING') {
                    const ab = b.activeBlock;
                    const hx = ab.x;
                    const hy = ab.y - ab.h / 2;

                    ctx.strokeStyle = '#111827';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(trolleyX, py + 3);
                    ctx.lineTo(hx, hy);
                    ctx.stroke();

                    ctx.strokeStyle = '#F8FAFC';
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.moveTo(trolleyX, py + 3);
                    ctx.lineTo(hx, hy);
                    ctx.stroke();

                    ctx.fillStyle = '#FACC15';
                    ctx.strokeStyle = '#111827';
                    ctx.lineWidth = 2;
                    ctx.fillRect(hx - 7, hy - 6, 14, 7);
                    ctx.strokeRect(hx - 7, hy - 6, 14, 7);
                }
                ctx.restore();
            }

            function drawParachuteCitizen(p) {
                ctx.save();
                ctx.translate(p.x, p.y);

                ctx.fillStyle = p.canopy;
                ctx.strokeStyle = '#111827';
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.arc(0, -17, 11, Math.PI, 0, false);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.strokeStyle = '#111827';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(-9, -17);
                ctx.lineTo(-2, -5);
                ctx.moveTo(9, -17);
                ctx.lineTo(2, -5);
                ctx.stroke();

                ctx.fillStyle = p.shirt;
                ctx.fillRect(-3, -5, 6, 6);
                ctx.fillStyle = '#FFE0B2';
                ctx.beginPath();
                ctx.arc(0, -8, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            }

            function lerpColor(a, b, t) {
                const c1 = parseInt(a.slice(1), 16);
                const c2 = parseInt(b.slice(1), 16);
                const r = Math.round(((c1 >> 16) & 255) * (1 - t) + ((c2 >> 16) & 255) * t);
                const g = Math.round(((c1 >> 8) & 255) * (1 - t) + ((c2 >> 8) & 255) * t);
                const bl = Math.round((c1 & 255) * (1 - t) + (c2 & 255) * t);
                return `rgb(${r},${g},${bl})`;
            }

            // =========================================================
            // 15. MASTER RENDER PASS
            // =========================================================
            function render() {
                state.hitboxes = [];
                ctx.clearRect(0, 0, W, H);

                if (state.mode === 'TITLE') {
                    renderTitleScreen();
                } else if (state.mode === 'CITY') {
                    renderCityScreen();
                } else if (state.mode === 'BUILD') {
                    renderBuildScreen();
                }

                ctx.save();
                if (state.mode === 'BUILD') {
                    ctx.translate(0, state.build.cameraY);
                }

                for (const p of state.particles) {
                    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
                    ctx.strokeStyle = '#111827';
                    ctx.lineWidth = 1.2;
                    ctx.strokeRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
                }
                ctx.globalAlpha = 1;

                for (const f of state.popups) {
                    ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.5));
                    ctx.font = `900 ${Math.round(18 * f.scale)}px 'Arial Black', Impact, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#111827';
                    ctx.fillText(f.text, f.x + 2, f.y + 2);
                    ctx.fillStyle = f.color;
                    ctx.fillText(f.text, f.x, f.y);
                }
                ctx.restore();

                if (state.toastTimer > 0 && state.toastText) {
                    const tw = Math.min(340, W - 20);
                    const tx = (W - tw) / 2;
                    const ty = state.mode === 'CITY' ? 66 : 96;
                    drawArcadeBox(tx, ty, tw, 32, '#0F172A', '#1E293B', '#111827', '#FACC15');
                    ctx.fillStyle = '#FACC15';
                    ctx.font = `900 10px 'Arial Black', sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(state.toastText, W / 2, ty + 16);
                }
            }

            // =========================================================
            // 16. UNIFIED POINTER & KEYBOARD INPUTS
            // =========================================================
            canvas.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                sfx.init();

                const rect = canvas.getBoundingClientRect();
                const px = e.clientX - rect.left;
                const py = e.clientY - rect.top;

                for (let i = state.hitboxes.length - 1; i >= 0; i--) {
                    const hb = state.hitboxes[i];
                    if (px >= hb.x && px <= hb.x + hb.w && py >= hb.y && py <= hb.y + hb.h) {
                        hb.onClick();
                        return;
                    }
                }

                if (state.mode === 'BUILD') {
                    dropBlock();
                }
            });

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'Enter') {
                    if (state.mode === 'BUILD') {
                        e.preventDefault();
                        sfx.init();
                        dropBlock();
                    } else if (state.mode === 'CITY' && state.citySubMode === 'AVITO') {
                        e.preventDefault();
                        sfx.init();
                        triggerAvitoDealHit();
                    } else if (state.mode === 'CITY' && state.citySubMode === 'COURT') {
                        e.preventDefault();
                        sfx.init();
                        hitCourtVerdict();
                    }
                }
            });

            // =========================================================
            // 17. MAIN GAME LOOP
            // =========================================================
            function loop(ts) {
                if (!state.lastTime) state.lastTime = ts;
                const dt = Math.min(0.05, (ts - state.lastTime) / 1000);
                state.lastTime = ts;

                update(dt);
                render();

                requestAnimationFrame(loop);
            }

            window.onload = function () {
                requestAnimationFrame(loop);
            };
        })();
    </script>
</body>
</html>
